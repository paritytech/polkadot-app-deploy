name: E2E (Paseo Bulletin)

# Per-event run title so post-merge push runs on main carry the PR number
# from the squash-merge commit message (`(#NNN)` suffix), giving readers a
# click-through path from the Actions list back to the originating PR.
# pull_request runs already display "Pull request #N opened by …" as a
# secondary label — the title here just keeps the visual cross-reference
# consistent across event types. Other events fall through to a default.
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) ||
      github.event_name == 'push' &&
      format('main: {0}', github.event.head_commit.message) ||
      github.event_name == 'release' &&
      format('release {0}: {1}', github.event.release.tag_name, github.event.release.name) ||
      github.event_name == 'workflow_dispatch' &&
      format('dispatch ({0}): {1}', inputs.test-suite, inputs.test-version) ||
      github.event_name }}

on:
  pull_request:
    branches: [main]
    paths-ignore:
      # package.json / package-lock.json deliberately NOT here (see #195):
      # a pure version bump and a dependency bump both touch only these two
      # files, and a path filter can't tell them apart — a dependency bump
      # (e.g. viem, which encodes every DotNS contract call) is exactly the
      # change class most likely to need chain validation. The
      # detect-deps-change job below diffs their content and classifies
      # instead; heavy jobs gate on its output rather than on path membership.
      # Ops scripts under tools/ never participate in the CI deploy paths.
      # Skip E2E when a PR only touches them.
      - tools/**
      # Any YAML change (workflows, dependabot, codeowners config, etc.) is
      # repo-meta — it doesn't affect deploy bytes. Unit Tests validates YAML
      # structurally via assertions in test/test.js; running chain E2E here
      # costs runner-minutes + chain capacity for no signal.
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - docs/**
      - docs-internal/**
      - sentry/**
      - .npmignore
      - .gitignore
      - LICENSE
  push:
    branches: [main]
    paths-ignore:
      # See the pull_request block above — package.json / package-lock.json
      # are classified by detect-deps-change, not path-ignored.
      - tools/**
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.md'
      - docs/**
      - docs-internal/**
      - sentry/**
      - .npmignore
      - .gitignore
      - LICENSE
  schedule:
    - cron: "0 15 * * *" # Staggered +12h from upstream private nightly (03:00 UTC) to avoid testnet contention
  release:
    # Fire only on prereleases (RCs). Stable releases publish straight through
    # publish.yml — by the time we cut a stable, we've already validated the
    # byte-identical source as an RC and don't need a second E2E run on the
    # same bytes minus the version-string change. See CLAUDE.md "Release"
    # section for the dual-stage RC → stable flow.
    types: [prereleased]
  workflow_dispatch:
    inputs:
      test-version:
        description: 'polkadot-app-deploy version to test (e.g. "0.6.10" or "rc"). Empty = latest stable.'
        type: string
        default: ''
      test-suite:
        description: 'E2E suite to run manually. "nightly" tests the reusable deploy workflow; "pr" runs the PR matrix against source; "v060" runs S-V060-UNBLOCK from source against the selected env, gated hard-fail on DotNS ABI profile v0.6.0 (issue #1410).'
        type: choice
        options:
          - nightly
          - pr
          - v060
        default: nightly
      runner:
        description: 'Runner label for E2E jobs (GitHub-hosted).'
        type: choice
        options:
          - ubuntu-latest
        default: ubuntu-latest
      primary-env:
        description: 'Primary E2E environment id (default: paseo-next-v2). Probed first; falls back to other e2eEligible envs if down.'
        type: string
        default: ''
      # Comma-separated scenario ids for a manual nightly dispatch. Empty (the
      # default, and the value on every non-dispatch trigger) = run all, so this
      # is a no-op on schedule/release/PR.
      # Nonce-chain safety: selecting a chained Alice-pool scenario (e.g. s6)
      # alone is safe — a filtered-out prerequisite (s5) skips and consumes no
      # nonces, and the jobs' `if: always()` lets the selected job still run;
      # when both are selected the existing `needs:` ordering still serializes.
      # Aggregate verifiers (telemetry / pool-distribution / code-path coverage /
      # address-drift) deliberately keep no filter — a subset cannot satisfy them.
      # nightly-pr-coverage and nightly-s-inc are also unfiltered: their scenario
      # id comes from the matrix, and the `matrix` context is NOT available in a
      # job-level `if:` (only github / needs / vars / inputs are). Referencing it
      # there makes the whole workflow invalid — GitHub rejects it at setup and
      # the run reports failure with zero jobs. A filtered dispatch therefore
      # still runs both matrices in full.
      scenarios:
        description: 'Comma-separated scenario ids to re-run on a manual nightly dispatch (e.g. "s6,s8,s9"). Empty (default) = all. Re-run only the flaky scenarios instead of the whole matrix.'
        type: string
        default: ''

permissions:
  # Workflow-level default: read-only. Jobs that need write access carry
  # an explicit per-job permissions: block below (pr-report, nightly-report).
  # All other jobs — including every test-pr matrix leg — run with
  # contents:read only.
  contents: read

concurrency:
  # Each trigger (pull_request, push, schedule, release, workflow_dispatch) gets
  # its own group because `event_name` is part of the key, so cross-event runs
  # never collide. Within a group — i.e. successive pushes to the same PR — a
  # new run must preempt the older one, otherwise the older run keeps the
  # serial PR matrix occupied and the newer run is parked behind it. The
  # check-runs for the older run are bound to the previous head sha, so the
  # PR's status rollup reads as "all checks passed" while the current head
  # sha gets no E2E coverage at all (see PR #482, runs #738/#739). A static
  # `true` here avoids the expression-evaluation race that left those runs
  # stuck.
  group: e2e-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# ==================================================================
# Two distinct surfaces, five triggers:
#
# Per-PR  — pull_request / push to main. Invokes HEAD's ./bin/polkadot-app-deploy
#           directly via node --test. Fast, catches CLI regressions on HEAD.
#           Does NOT exercise the shipped reusable workflow.
#
# Nightly — schedule / release / workflow_dispatch. Calls the shipped reusable
#           .github/workflows/deploy.yml. Tests the consumer install path
#           (real npm install) against live Paseo Bulletin.
#
#           Version installed depends on trigger:
#             schedule         → latest stable (empty version)
#             release          → the just-published version (tag minus v prefix)
#             workflow_dispatch → `inputs.test-version` (empty = latest stable)
#
#           Release-triggered runs are the post-publish validation that
#           replaces the manual /tests-pass ritual. Failures auto-open a
#           GitHub issue.
# ==================================================================

jobs:

  # ---- Per-PR -----------------------------------------------------

  # Detect pushes whose tree SHA is identical to the previous head — i.e. the
  # commit content is unchanged and only metadata (GPG signature, author,
  # date) was rewritten by an amend + force-push. The PR's previous CI run
  # already attested the same bytes, so re-running the matrix would burn
  # testnet without learning anything new.
  #
  # Triggers covered: pull_request (synchronize payloads expose `before`) and
  # push to main. Other triggers (workflow_dispatch, release, schedule) skip
  # this job and fall through to the normal `if` checks below — the gate
  # treats a skipped predecessor as "not a noop, run CI".
  detect-noop-push:
    name: Detect signature-only push or stale main
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      is_noop: ${{ steps.compare.outputs.is_noop }}
    steps:
      - id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh_get() {
            curl -fsSL \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }
          # Stale-main check: push events on main where main has already moved
          # past this run's SHA are no-ops — the newer push's run will exercise
          # this SHA's tree transitively. Skipping here avoids running an
          # outdated matrix against testnet, which is the dominant queue cost
          # when several PRs land back-to-back.
          if [[ "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            MAIN_HEAD=$(gh_get "https://api.github.com/repos/$REPO/commits/main" | jq -r .sha)
            if [[ "$MAIN_HEAD" != "$AFTER" ]]; then
              echo "Stale main push: this run is for $AFTER but main has moved to $MAIN_HEAD. Newer run will exercise the resulting tree."
              echo "is_noop=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if [[ -z "${BEFORE:-}" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "No 'before' SHA — branch creation or non-synchronize PR event. Treating as content change."
            echo "is_noop=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          get_tree() {
            gh_get "https://api.github.com/repos/$REPO/commits/$1" | jq -r .commit.tree.sha
          }
          BEFORE_TREE=$(get_tree "$BEFORE")
          AFTER_TREE=$(get_tree "$AFTER")
          echo "before=$BEFORE tree=$BEFORE_TREE"
          echo "after=$AFTER  tree=$AFTER_TREE"
          if [[ "$BEFORE_TREE" == "$AFTER_TREE" ]]; then
            echo "Signature-only / noop push detected (working tree unchanged). E2E will be skipped."
            echo "is_noop=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tree changed; E2E will run."
            echo "is_noop=false" >> "$GITHUB_OUTPUT"
          fi

  # ---- Dependency-bump discriminator (#195) -----------------------------
  #
  # package.json / package-lock.json are no longer in paths-ignore (see the
  # `on:` block above): a pure version bump and a dependency bump both touch
  # only these two files, and a path filter cannot tell them apart even
  # though a dependency bump (e.g. viem, which encodes every DotNS contract
  # call — see #190) is exactly the change class most likely to need chain
  # validation. This job fetches both files' content at the PR/push base and
  # head SHAs and classifies the diff:
  #   - version field only (package.json .version, and lockfile .version +
  #     .packages[""].version) → is_version_only=true. Heavy E2E jobs stay
  #     gated off — release/RC version bumps stay free, same guarantee the
  #     old paths-ignore membership used to give.
  #   - anything else (dependencies/devDependencies/overrides/
  #     peerDependencies, or the resolved lockfile tree) → is_version_only=
  #     false. A version bump mixed with a real dependency change in the
  #     same PR also lands here — mixed is NOT safe to skip.
  #   - neither file touched at all (the common case: an ordinary source PR)
  #     → is_version_only=false too, so this job only ever skips the narrow
  #     release-version-bump shape, never a normal source change.
  #
  # Every consumer below gates on is_version_only alone; there is no
  # separate deps_changed output (it would only ever be that field's trivial
  # negation — see the classify step's log line for the value if you need it
  # while debugging a run).
  #
  # Uses the Contents API (full file content) rather than the Compare API's
  # unified diff: GitHub omits `patch` for large files, and a lockfile is
  # exactly the file most likely to hit that ceiling as the dependency tree
  # grows. Comparing full content is correct regardless of file size.
  #
  # The classification logic itself lives in the shared
  # .github/scripts/classify-version-bump.cjs, not inline here — tests.yml's
  # own classify job (gating Unit Tests) uses the identical script, so the
  # two workflows can never disagree on what counts as version-only.
  detect-deps-change:
    name: Classify package.json/lock diff (version bump vs dependency change)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      is_version_only: ${{ steps.classify.outputs.is_version_only }}
    steps:
      # This job deliberately does NOT check out the full repo (it fetches
      # both sides of the diff via the contents API instead, so it works for
      # a PR from any ref) — just the shared classifier script, via sparse
      # checkout, plus Node to run it.
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            # $1=sha $2=path $3=outfile. Missing/404 → empty outfile, treated
            # as "file did not exist at that ref" by the classifier below.
            curl -fsSL -H "Authorization: bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/$REPO/contents/$2?ref=$1" -o "$3" 2>/dev/null || : > "$3"
          }
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA to diff against (branch creation) — treating as dependency-affecting to be safe."
            echo "is_version_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fetch "$BASE_SHA" package.json base_pkg.json
          fetch "$HEAD_SHA" package.json head_pkg.json
          fetch "$BASE_SHA" package-lock.json base_lock.json
          fetch "$HEAD_SHA" package-lock.json head_lock.json
          node .github/scripts/classify-version-bump.cjs

  # ---- Env selector ----------------------------------------------------
  #
  # Probes the primary E2E env (paseo-next-v2 by default, override via
  # workflow_dispatch.primary-env input). If unhealthy, iterates every
  # entry in assets/environments.json with e2eEligible:true in declaration
  # order and picks the first healthy one. Falls back through all of them
  # before failing the job.
  #
  # In PR 2 (this PR), select-env drives both per-PR and nightly jobs.
  # See docs-internal/superpowers/specs/2026-05-29-e2e-env-fallback-design.md.

  select-env:
    name: Select E2E environment (probe + fallback)
    needs: [detect-noop-push, detect-deps-change]
    if: |
      always() &&
      (needs.detect-noop-push.result == 'skipped' || needs.detect-noop-push.outputs.is_noop != 'true') &&
      (needs.detect-deps-change.result == 'skipped' || needs.detect-deps-change.outputs.is_version_only != 'true') &&
      (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # 6 min was sized for the probe alone; the readiness check (#1624) adds
    # npm ci + build + one bounded check per live env on nightly-class events.
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      selected_env: ${{ steps.select.outputs.selected_env }}
      # healthy_envs: JSON array of the envs the scenario matrices fan out over.
      # Schedule (cron): every live env that is also READY (#1624). A live env
      # whose readiness check says not-ready (DotNS ABI drift, signer below its
      # floor, S3 fixture gone) is left out; it is in not_ready instead.
      # Release and workflow_dispatch: a single-element array containing
      # selected_env so those runs stay fast (release gating must not fan out).
      healthy_envs: ${{ steps.select.outputs.healthy_envs }}
      # ready_envs: JSON array of live envs that passed readiness (all live envs
      # on events that do not run the readiness check).
      ready_envs: ${{ steps.select.outputs.ready_envs }}
      # not_ready: JSON object env -> [{check, reason}] for live envs that failed
      # readiness. "{}" when none. Read by nightly-report (#1624).
      not_ready: ${{ steps.select.outputs.not_ready }}
      # canary_envs: every LIVE env on schedule (ready or not); [selected_env]
      # otherwise. Used ONLY by nightly-s1-direct, so one S1 direct leg still
      # runs on a not-ready env and a wrongly-red probe is visible.
      canary_envs: ${{ steps.select.outputs.canary_envs }}
      primary_healthy: ${{ steps.select.outputs.primary_healthy }}
      fallback_used: ${{ steps.select.outputs.fallback_used }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      # The readiness check (#1624) imports dist/ (DotNS profile detection, fee
      # floors, balance readers), unlike probe-env-health.mjs which stays
      # build-free. Only nightly-class events run it, so PR/push select-env
      # keeps its probe-only cost.
      - name: npm ci (readiness check)
        if: github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - name: npm run build (readiness check)
        if: github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')
        run: npm run build
      - id: select
        env:
          PRIMARY_ENV: ${{ inputs.primary-env || 'paseo-next-v2' }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_READINESS: ${{ (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && 'true' || 'false' }}
        shell: bash
        run: |
          set -uo pipefail
          # Build ordered probe list: primary first, then the other eligible envs.
          ALL_ELIGIBLE=$(node -e '
            const doc = JSON.parse(require("fs").readFileSync("assets/environments.json"));
            doc.environments.filter(e => e.e2eEligible).forEach(e => console.log(e.id));
          ')
          PROBE_ORDER=("$PRIMARY_ENV")
          for env in $ALL_ELIGIBLE; do
            if [[ "$env" != "$PRIMARY_ENV" ]]; then
              PROBE_ORDER+=("$env")
            fi
          done
          HEALTHY=()
          SELECTED=""
          for env in "${PROBE_ORDER[@]}"; do
            if node tools/probe-env-health.mjs --env "$env"; then
              HEALTHY+=("$env")
              if [[ -z "$SELECTED" ]]; then
                SELECTED="$env"
              fi
            fi
          done
          if [[ ${#HEALTHY[@]} -eq 0 ]]; then
            echo "❌ All E2E-eligible envs are unhealthy" >&2
            exit 1
          fi
          # Build JSON array from the healthy (live) list.
          HEALTHY_JSON=$(jq -nc '$ARGS.positional' --args "${HEALTHY[@]}")
          # Readiness (#1624): a live env can still be untestable (DotNS ABI
          # drift, a signer below its floor, the S3 fixture gone), which turns
          # every leg on it red at once. Check each live env; "unknown" (probe
          # glitch, tool crash, no summary line) never marks an env not-ready.
          READY=()
          NOT_READY_JSON='{}'
          # One node process per live env (startup + dist imports + DotNS connect
          # each), so run them concurrently and read the results in probe order.
          RDIR=$(mktemp -d)
          if [[ "$RUN_READINESS" == "true" ]]; then
            for env in "${HEALTHY[@]}"; do
              node tools/check-env-readiness.mjs --env "$env" > "$RDIR/$env.out" 2>&1 &
            done
            wait
          fi
          for env in "${HEALTHY[@]}"; do
            if [[ "$RUN_READINESS" == "true" ]]; then
              OUT=$(cat "$RDIR/$env.out" 2>/dev/null || true)
              echo "::group::Readiness: $env"
              printf '%s\n' "$OUT"
              echo "::endgroup::"
              LINE=$(printf '%s\n' "$OUT" | grep '^ENV_READINESS ' | tail -n 1 | sed 's/^ENV_READINESS //')
              if [[ -z "$LINE" ]]; then
                echo "::warning::readiness for $env produced no summary line; treating as unknown (env stays ready)"
              else
                if echo "$LINE" | jq -e '(.unknown | length) > 0' >/dev/null 2>&1; then
                  echo "::warning::readiness for $env has unknown checks (not gating): $(echo "$LINE" | jq -c '.unknown')"
                fi
                if echo "$LINE" | jq -e '.ready == false' >/dev/null 2>&1; then
                  NOT_READY_JSON=$(jq -c --arg e "$env" --argjson l "$LINE" '. + {($e): $l.reasons}' <<<"$NOT_READY_JSON")
                  echo "::warning::env $env is NOT READY: $(echo "$LINE" | jq -c '.reasons')"
                  continue
                fi
              fi
            fi
            READY+=("$env")
          done
          # jq --args with an empty list prints nothing on some builds; spell out [].
          if [[ ${#READY[@]} -eq 0 ]]; then READY_JSON='[]'; else READY_JSON=$(jq -nc '$ARGS.positional' --args "${READY[@]}"); fi
          # Schedule: the selected (single-env) jobs move to the first READY env
          # (falling back to the first live one when none is ready; the matrix
          # is then skipped, see build-nightly). Release/dispatch keep SELECTED
          # as is: the gate must not quietly move to a different env.
          if [[ "$EVENT_NAME" == "schedule" && ${#READY[@]} -gt 0 ]]; then
            SELECTED="${READY[0]}"
          fi
          # For schedule (cron) nightly: fan out across the READY envs, plus
          # canary_envs = every live env for the one S1 direct canary job.
          # For release + workflow_dispatch: single-env to keep the gate fast.
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            FAN_OUT_ENVS="$READY_JSON"
            CANARY_ENVS="$HEALTHY_JSON"
          else
            FAN_OUT_ENVS="[\"$SELECTED\"]"
            CANARY_ENVS="$FAN_OUT_ENVS"
          fi
          {
            echo "selected_env=$SELECTED"
            echo "healthy_envs=$FAN_OUT_ENVS"
            echo "ready_envs=$READY_JSON"
            echo "not_ready=$NOT_READY_JSON"
            echo "canary_envs=$CANARY_ENVS"
          } >> "$GITHUB_OUTPUT"
          if [[ "$SELECTED" == "$PRIMARY_ENV" ]]; then
            echo "primary_healthy=true" >> "$GITHUB_OUTPUT"
            echo "fallback_used=false" >> "$GITHUB_OUTPUT"
          else
            echo "primary_healthy=false" >> "$GITHUB_OUTPUT"
            echo "fallback_used=true" >> "$GITHUB_OUTPUT"
          fi
          echo "Healthy envs: ${HEALTHY[*]:-none}"
          echo "Fan-out envs (healthy_envs): $FAN_OUT_ENVS"
          echo "Selected (single-env fallback / release gate): $SELECTED"
          echo "Ready envs: $READY_JSON  Not ready: $NOT_READY_JSON  Canary envs: $CANARY_ENVS"
          # A release gate on the wrong env is worse than a red gate: when the
          # env the gate would run on is not ready, fail with the reasons rather
          # than fall back to a different env. (workflow_dispatch only warns:
          # the caller asked for that env and is watching.)
          if jq -e --arg e "$SELECTED" 'has($e)' <<<"$NOT_READY_JSON" >/dev/null; then
            REASONS=$(jq -r --arg e "$SELECTED" '.[$e][] | "  - \(.check): \(.reason)"' <<<"$NOT_READY_JSON")
            if [[ "$EVENT_NAME" == "release" ]]; then
              echo "::error::Release gate env $SELECTED is not ready; refusing to run the gate there or on another env:"$'\n'"$REASONS"
              echo "Release gate env $SELECTED is not ready:" >&2
              printf '%s\n' "$REASONS" >&2
              exit 1
            fi
            echo "::warning::selected env $SELECTED is not ready (running anyway on this $EVENT_NAME event):"$'\n'"$REASONS"
          fi

  # ---- Per-PR smoke ---------------------------------------------------
  #
  # Two parallel matrix legs (pool + direct), each running scenario s1-smoke
  # against a per-run fresh DotNS label (pickFreshRunLabel("e2esmoke")). The
  # full 11-leg matrix that used to live here moved to the nightly-pr-coverage
  # matrix at HEAD — see #530 / docs-internal/superpowers/specs/2026-05-22-ci-restructure-design.md.

  test-pr:
    name: PR · s1-smoke ${{ matrix.signer }}/${{ matrix.merkle }}
    needs: [detect-noop-push, detect-deps-change, select-env]
    # Run when one of the trigger paths fires AND either the noop-detect was
    # skipped (workflow_dispatch path) or it ran and the tree actually changed.
    # `always()` is required so a skipped predecessor doesn't auto-skip us.
    # `select-env.result == 'success'` is required so we skip the matrix
    # when all eligible envs are unhealthy — without it, always() would let
    # test-pr run with an empty PAD_ENV and fall back to the
    # CLI default (paseo-next-v2), defeating the fallback. select-env already
    # cascades the detect-deps-change gate (a version-only bump skips
    # select-env, which fails this same check), but the explicit check here
    # keeps the property directly verifiable on this job too (#195).
    if: |
      always() &&
      needs.select-env.result == 'success' &&
      (needs.detect-noop-push.result == 'skipped' || needs.detect-noop-push.outputs.is_noop != 'true') &&
      (needs.detect-deps-change.result == 'skipped' || needs.detect-deps-change.outputs.is_version_only != 'true') &&
      (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'pr'))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: s1-smoke, signer: pool,   merkle: js }
          - { scenario: s1-smoke, signer: direct, merkle: kubo }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: npm ci
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - name: Restore Kubo from cache
        if: matrix.merkle == 'kubo'
        uses: actions/cache@v5
        with:
          path: ~/.cache/kubo
          key: kubo-v0.33.0-linux-amd64
      - name: Setup IPFS Kubo
        if: matrix.merkle == 'kubo'
        run: |
          if [ ! -f ~/.cache/kubo/ipfs ]; then
            mkdir -p ~/.cache/kubo
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o /tmp/kubo.tar.gz https://dist.ipfs.tech/kubo/v0.33.0/kubo_v0.33.0_linux-amd64.tar.gz
            tar -xf /tmp/kubo.tar.gz -C /tmp
            cp /tmp/kubo/ipfs ~/.cache/kubo/ipfs
            rm -rf /tmp/kubo /tmp/kubo.tar.gz
          fi
          sudo cp ~/.cache/kubo/ipfs /usr/local/bin/ipfs
          ipfs version
      - name: Initialize IPFS
        if: matrix.merkle == 'kubo'
        run: ipfs init
      # Retry on any failure once (not selective): for a ~5 min smoke leg the
      # worst-case 10 min wall time is still under the PR-feedback target,
      # and avoids the maintenance cost of a flake-class classifier wrapper
      # at this tier. Selective retry lives on release legs only (PR 3).
      - name: Run smoke (one retry on any transient failure)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          E2E: "1"
          E2E_SCENARIO: s1-smoke
          # bulletin #1623: each PR deploys to its own label (registered on its first
          # run). Empty on push/dispatch, which use the provisioned pr-tier label.
          E2E_PR_NUMBER: ${{ github.event.pull_request.number }}
          E2E_SIGNER: ${{ matrix.signer }}
          E2E_MERKLE: ${{ matrix.merkle }}
          PAD_ENV: ${{ needs.select-env.outputs.selected_env }}
          DEPLOY_TAG: e2e-ci-pr
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          command: node --test test/e2e.test.js
      - name: Upload polkadot-app-deploy forensic log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log-s1-smoke-${{ matrix.signer }}-${{ matrix.merkle }}
          path: e2e-reports/
          retention-days: 7
          if-no-files-found: ignore

  pr-report:
    name: PR E2E Report
    needs: [test-pr, detect-noop-push, detect-deps-change]
    # Same gate as test-pr: if the push was signature-only OR a release
    # version-only bump, both test-pr and this report are skipped — the PR
    # keeps its previous green checks (#195).
    if: |
      always() &&
      (needs.detect-noop-push.result == 'skipped' || needs.detect-noop-push.outputs.is_noop != 'true') &&
      (needs.detect-deps-change.result == 'skipped' || needs.detect-deps-change.outputs.is_version_only != 'true') &&
      (github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'pr'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # actions:read — needed for GET /runs/{id}/jobs (fetch per-leg results)
      actions: read
      # pull-requests:write — needed to post/update the E2E result comment on PRs
      pull-requests: write
    steps:
      - name: Fetch per-leg results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # bash -e doesn't fail piped commands by default; without pipefail
        # an early-pipeline failure (e.g. missing `gh` on the runner — yes,
        # this happened) silently produces an empty TSV and a headerless
        # PR-comment table. Use curl directly (always present) and force
        # pipefail so any future regression breaks the job loudly.
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          # needs.test-pr.result exposes only the matrix aggregate; fetch
          # per-leg conclusions from the Runs API so the PR comment shows
          # what failed.
          curl -fsSL \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
            | jq -r '.jobs[] | select(.name | startswith("PR · ")) | "\(.name)\t\(.conclusion)"' \
            > /tmp/legs.tsv
          # Fail loudly rather than render an empty table.
          if [ ! -s /tmp/legs.tsv ]; then
            echo "::error::No 'PR · …' jobs found in run ${{ github.run_id }}; job names may have changed (the report job filters startswith 'PR · ')."
            exit 1
          fi
          echo "Per-leg results:" && cat /tmp/legs.tsv

      - name: Render report body
        env:
          HEAD_REF_OR_NAME: ${{ github.head_ref || github.ref_name }}
          AGGREGATE: ${{ needs.test-pr.result == 'success' && 'success' || 'failure' }}
        run: |
          emoji() { case "$1" in
            success)   echo "✅ PASS";;
            failure)   echo "❌ FAIL";;
            skipped)   echo "⏭️ SKIP";;
            cancelled) echo "🚫 CANCEL";;
            *)         echo "❓ $1";;
          esac; }

          BRANCH="$HEAD_REF_OR_NAME"
          SHA_SHORT="${GITHUB_SHA:0:7}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          {
            echo "<!-- e2e-pr-report -->"
            echo "## E2E Test Pass · $(emoji "$AGGREGATE")"
            echo ""
            echo "Tag: \`e2e-ci-pr\` · Branch: \`$BRANCH\` · Commit: \`$SHA_SHORT\` · [Run logs]($RUN_URL)"
            echo ""
            echo "| Scenario | Result |"
            echo "|----------|--------|"
            while IFS=$'\t' read -r name conclusion; do
              echo "| \`${name#PR · }\` | $(emoji "$conclusion") |"
            done < /tmp/legs.tsv
            echo ""
            echo "**Sentry:** [E2E Health dashboard](https://paritytech.sentry.io/dashboard/1732713/?project=4511093597405264) · [raw traces](https://paritytech.sentry.io/explore/traces/?project=4511093597405264&query=deploy.tag%3Ae2e-ci-pr)"
          } > /tmp/pr-body.md

          cat /tmp/pr-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/pr-body.md', 'utf8');
            const marker = '<!-- e2e-pr-report -->';
            const prNumber = context.issue.number;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  # ---- Dispatch-only: v0.6.0 validation (bulletin #1423/#1410) ----------
  #
  # S-V060-UNBLOCK (test/e2e.test.js) exercises v0.6.0-only DotNS naming
  # semantics (issue #1410) that do not exist on every env yet. This repo has
  # no preview env to fall back to (unlike bulletin-deploy) — it targets
  # whatever select-env resolves, which is why validating it stays a manual
  # dispatch rather than automatic nightly/PR coverage. It therefore does NOT
  # run on pull_request/push, and does NOT fold into the nightly fan-out (this
  # job's `if:` only fires for `workflow_dispatch` + `inputs.test-suite ==
  # 'v060'`, structurally distinct from the 'nightly' value every nightly-*
  # job gates on below). `test/` is not published to npm (see package.json's
  # `files` allowlist), so this scenario can only ever run from a SOURCE
  # checkout — there is no npm-install path to fall back to; this job always
  # builds from the checked-out ref.
  #
  # E2E_REQUIRE_PROFILE=v0.6.0 turns "chain not yet on v0.6.0" into a hard
  # FAILURE rather than S-V060-UNBLOCK's own default soft-skip (see the
  # scenario's own gateOnV060Profile) — appropriate here because dispatching
  # this leg IS the explicit ask for v0.6.0 validation; a quiet skip would
  # read as a false green.
  dispatch-s-v060-unblock:
    name: Dispatch · S-V060-UNBLOCK (gated hard-fail on DotNS ABI profile v0.6.0)
    needs: [select-env]
    if: always() && needs.select-env.result == 'success' && github.event_name == 'workflow_dispatch' && inputs.test-suite == 'v060'
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: npm ci
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - run: npm run build
      - name: Run S-V060-UNBLOCK against the selected env, hard-failing if it is not yet on DotNS ABI profile v0.6.0
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          E2E: "1"
          E2E_SCENARIO: s-v060-unblock
          E2E_REQUIRE_PROFILE: v0.6.0
          E2E_SIGNER: pool
          E2E_MERKLE: js
          PAD_ENV: ${{ needs.select-env.outputs.selected_env }}
          DEPLOY_TAG: e2e-ci-dispatch
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on: any
          command: node --test test/e2e.test.js
      - name: Upload polkadot-app-deploy forensic log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log-s-v060-unblock
          path: e2e-reports/
          retention-days: 7
          if-no-files-found: ignore

  # ---- Nightly ----------------------------------------------------

  build-nightly:
    name: Prepare fixture artifact (nightly)
    needs: select-env
    # healthy_envs == '[]' means no live env passed readiness (#1624): there is
    # nothing to test, and an empty matrix would error every scenario job. The
    # env-not-ready issue filed by nightly-report is the signal that night.
    if: always() && needs.select-env.result == 'success' && needs.select-env.outputs.healthy_envs != '[]' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # Raised from 20 to 58 to accommodate the publish.yml human-approval wait
    # (up to ~45 min) on release triggers. The 60-min ceiling (safety-net test)
    # is still respected: 45-min publish-wait cap + ~1-2 min npm poll (post-
    # approval) + setup/fixture overhead all fit under 58.
    timeout-minutes: 58
    permissions:
      contents: read
      # actions:read is required to list workflow runs via the Actions REST API
      # (/repos/.../actions/workflows/publish.yml/runs) in the publish-wait step.
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      test-version: ${{ steps.version.outputs.test-version }}
      deploy-tag: ${{ steps.version.outputs.deploy-tag }}
      # Git ref to source-build, OR empty when test-version is set (npm install).
      # Schedule + workflow_dispatch with empty version → main HEAD source build,
      # so nightly exercises whatever just merged. Release + dispatch with an
      # explicit version → install from npm to test the actual published artifact.
      polkadot-app-deploy-ref: ${{ steps.version.outputs.polkadot-app-deploy-ref }}
      # Tag whose test harness (test/, tools/, package.json) the published-version
      # legs run (bulletin #1621): `v<test-version>`, EMPTY on the source-build path. Keyed
      # off the resolved version, never the cron string. A harness from HEAD
      # imports internals that an older published dist does not export.
      harness-ref: ${{ steps.version.outputs.harness-ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: npm ci
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - name: Resolve test-version and deploy-tag from trigger
        id: version
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_VERSION: ${{ inputs.test-version }}
        run: |
          # What's tested:
          #   schedule         → source-build main HEAD (V empty → REF=github.sha).
          #                      Catches regressions in queued PRs same-day.
          #   release          → install from npm at the released version.
          #                      Validates the actual published artifact.
          #   workflow_dispatch → if input.test-version is set, install from npm
          #                       (lets ops test a specific RC or older release).
          #                       If empty, source-build like schedule.
          case "$EVENT" in
            release)
              V="${RELEASE_TAG#v}"  # strip leading v
              TAG="e2e-ci-release"
              ;;
            workflow_dispatch)
              V="$DISPATCH_VERSION"
              TAG="e2e-ci-dispatch"
              ;;
            *)
              V=""
              TAG="e2e-ci-nightly"
              ;;
          esac
          # Source-build whenever no npm version was requested. github.sha is
          # the commit that triggered this workflow run; for schedule, that's
          # the main HEAD at cron-fire time.
          if [ -z "$V" ]; then
            REF="${{ github.sha }}"
          else
            REF=""
          fi
          # Published-version path: the scenario jobs run the test harness from
          # the tag of the version under test (bulletin #1621), not from this run's HEAD.
          # Fail here, once, if that tag is missing — otherwise every leg would
          # die later with an opaque checkout error.
          if [ -n "$V" ]; then
            HARNESS_REF="v$V"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$HARNESS_REF" >/dev/null 2>&1; then
              echo "::error::git tag $HARNESS_REF not found on origin — the published-version tier runs the test harness from the tag of the version under test (bulletin #1621), so @parity/polkadot-app-deploy@$V cannot be tested without it. Push the tag, or dispatch with a version that has one." >&2
              exit 1
            fi
          else
            HARNESS_REF=""
          fi
          echo "test-version=$V" >> "$GITHUB_OUTPUT"
          echo "deploy-tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "polkadot-app-deploy-ref=$REF" >> "$GITHUB_OUTPUT"
          echo "harness-ref=$HARNESS_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved: test-version='$V', deploy-tag='$TAG', polkadot-app-deploy-ref='$REF', harness-ref='$HARNESS_REF' (event=$EVENT)"
      - name: Wait for publish.yml to complete
        # Only on release: publish.yml fires on `release: created` (the same event
        # that fired us) but it pauses behind a `environment: release` human-
        # approval gate. The RC is not on npm until a maintainer approves and the
        # automation publish step runs — which can take 20-60+ min. Polling npm
        # directly from the start meant this job timed out waiting (10-min budget
        # exhausted before approval), causing the gating E2E to fail with zero
        # scenarios run. We now wait for publish.yml to complete first, then do a
        # short npm poll for the automation lag (~1-2 min post-approval).
        #
        # Guard is `github.event_name == 'release'` — NOT `test-version != ''`.
        # workflow_dispatch with a version string also sets test-version, but there
        # is no live publish.yml run in that case (re-testing an already-published
        # RC). Using the wrong guard would spin the whole 45-min cap hunting a run
        # that will never exist.
        if: github.event_name == 'release'
        timeout-minutes: 47
        env:
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh_get() {
            curl -fsSL \
              -H "Authorization: bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$1"
          }
          TAG="${{ github.event.release.tag_name }}"
          echo "Waiting for publish.yml run triggered by release $TAG (head_sha=$HEAD_SHA)..."

          # publish.yml fires on `release: created` from the same release event.
          # Both workflows share the same tag commit (head_sha). Correlate by
          # head_sha + event=release to find the right run.
          #
          # Cap at 270 iterations × 10s = 45 min. The first few iterations may
          # return an empty list (webhook delivery skew) — that is not an error.
          FOUND_RUN_ID=""
          for i in $(seq 1 270); do
            RUNS=$(gh_get "https://api.github.com/repos/$REPO/actions/workflows/publish.yml/runs?event=release&head_sha=$HEAD_SHA&per_page=5")
            TOTAL=$(echo "$RUNS" | jq '.total_count // 0')
            if [[ "$TOTAL" -gt "0" ]]; then
              FOUND_RUN_ID=$(echo "$RUNS" | jq -r '.workflow_runs[0].id')
              STATUS=$(echo "$RUNS" | jq -r '.workflow_runs[0].status')
              CONCLUSION=$(echo "$RUNS" | jq -r '.workflow_runs[0].conclusion // "null"')
              echo "  attempt $i: publish.yml run $FOUND_RUN_ID status=$STATUS conclusion=$CONCLUSION"
              if [[ "$STATUS" == "completed" ]]; then
                if [[ "$CONCLUSION" == "success" ]]; then
                  echo "publish.yml completed successfully — proceeding to npm poll"
                  exit 0
                else
                  echo "::error::publish.yml run $FOUND_RUN_ID completed with conclusion=$CONCLUSION (tag=$TAG). The release may have been rejected or failed. Check the publish.yml run for details."
                  exit 1
                fi
              fi
            else
              echo "  attempt $i: no publish.yml run found yet for head_sha=$HEAD_SHA — waiting for webhook delivery"
            fi
            sleep 10
          done
          echo "::error::Timed out after 45 min waiting for publish.yml to complete for tag=$TAG (head_sha=$HEAD_SHA). The human approval may still be pending or the run never appeared."
          exit 1
      - name: Wait for polkadot-app-deploy@$V on npm
        # After publish.yml completes (human approval → automation publish), the
        # package typically appears on npm within 1-2 min. Cap at 5 min (30 × 10s)
        # — the old 10-min budget absorbed the approval wait, which is now handled
        # upstream by the publish.yml wait step above.
        # Skipped when test-version is empty (schedule trigger uses @latest).
        if: steps.version.outputs.test-version != ''
        timeout-minutes: 7
        env:
          V: ${{ steps.version.outputs.test-version }}
        run: |
          echo "Waiting for @parity/polkadot-app-deploy@$V on npm registry..."
          for i in $(seq 1 30); do
            if npm view "@parity/polkadot-app-deploy@$V" version >/dev/null 2>&1; then
              echo "Found @parity/polkadot-app-deploy@$V on attempt $i"
              exit 0
            fi
            echo "  attempt $i/30: not yet available, sleeping 10s"
            sleep 10
          done
          echo "::error::Timed out waiting for @parity/polkadot-app-deploy@$V on npm after 5 minutes (publish.yml completed but npm automation has not surfaced the package). This may be a transient registry delay — re-run the E2E workflow manually once the package appears."
          exit 1
      - name: Mutate fixture into build/
        id: prep
        env:
          E2E_BUILD_DIR: ./build
        run: node test/helpers/e2e-ci-prep.js
      - uses: actions/upload-artifact@v7
        with:
          name: e2e-fixture-nightly
          path: build/
          retention-days: 1

  # ---- Prerequisite: make every E2E signer account ready before the matrix
  #
  # v0.16.0-rc.2's gating run was 38 pass / 4 fail; 3 of the 4 failures were
  # ONE cause — lapsed/missing Bulletin storage authorization for //e2e-s9,
  # //e2e-sgrandpa, and //e2e-fresh-pool (the last one never authorized at
  # all because a maintainer provisioning tool's hardcoded signer list didn't
  # include it — a list-drift bug). Two of the three presented exactly like
  # this repo's documented retry-eligible flakes (`Invalid::Stale`), so a
  # rerun would have failed again identically — the real cause is an
  # off-chain grant, not a chain hiccup. This job fails FAST and LEGIBLY
  # (naming every affected account) instead of letting that surface 20+
  # minutes later as a scenario-leg `exit 78` that looks like a flake.
  #
  # See scripts/e2e-ensure-authorized.mjs for how the signer list is derived:
  # it is parsed from THIS file's own derivation-path/poolIndex matrix values
  # plus test/e2e.test.js's ISOLATED_DIRECT_SIGNERS — no separate hardcoded
  # list to fall out of sync with the matrix below (the exact drift bug this
  # job exists to prevent from recurring).
  #
  # Scope: runs once against select-env's single `selected_env` — the
  # release-gating / workflow_dispatch path this bug actually hit. On a
  # `schedule` multi-env fan-out (healthy_envs), this does NOT pre-authorize
  # secondary envs, only the primary. Fanning this job out over healthy_envs
  # too is a reasonable follow-up, intentionally not done here to keep the
  # wiring simple for the case that matters (release gating is single-env).
  ensure-e2e-authorized:
    name: Nightly · Ensure E2E signers authorized
    needs: select-env
    if: always() && needs.select-env.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: npm ci
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - run: npm run build
      - name: Ensure E2E signer accounts are authorized + funded
        env:
          PAD_ENV: ${{ needs.select-env.outputs.selected_env }}
        run: node scripts/e2e-ensure-authorized.mjs --env "$PAD_ENV"

  # Policy (bulletin #1621): a published-version run exercises the scenarios AS OF that tag
  # (harness + dist versioned together); scenarios added on main since are covered
  # by the source-build tier, not this one.
  # ---- Harness-import smoke: published-version tier only. The scenario
  # jobs below run the test harness from the tag of the version under test
  # against that version's installed dist. If the harness cannot even load
  # against it (a missing export, a renamed module), every leg would die with the
  # same SyntaxError; this job reds ONCE with that error and the jobs that
  # `needs:` it skip. With E2E unset every scenario is skipped, but node still
  # evaluates the harness's whole static import graph, which is the point.
  nightly-harness-smoke:
    name: Nightly harness-import smoke (${{ needs.build-nightly.outputs.test-version }})
    needs: [build-nightly]
    if: always() && needs.build-nightly.result == 'success' && needs.build-nightly.outputs.harness-ref != '' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      HARNESS_REF: ${{ needs.build-nightly.outputs.harness-ref }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: Use the test harness from the tag under test (#1621)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/tags/$HARNESS_REF:refs/tags/$HARNESS_REF"
          git checkout "$HARNESS_REF" -- . ':(exclude).github'
          echo "Harness (test/, tools/, package.json) from $HARNESS_REF ($(git rev-parse "$HARNESS_REF^{commit}")); workflow + .github from $GITHUB_SHA"
      - name: Install polkadot-app-deploy from npm
        uses: ./.github/actions/npm-retry
        with:
          run: |
            # Same setup as the scenario jobs: the harness resolves ../dist.
            npm install --no-save "@parity/polkadot-app-deploy@${BULLETIN_DEPLOY_VERSION}" ws
            ln -sfn node_modules/@parity/polkadot-app-deploy/dist dist
      - name: Import the harness against the installed dist
        run: |
          unset E2E
          set +e
          node --test test/e2e.test.js > /tmp/harness-smoke.log 2>&1
          RC=$?
          set -e
          cat /tmp/harness-smoke.log
          if [ "$RC" != "0" ]; then
            CAUSE="$(grep -aE 'SyntaxError|ERR_MODULE_NOT_FOUND|ERR_PACKAGE_PATH_NOT_EXPORTED' /tmp/harness-smoke.log | head -n 1 | tr -d '\r')"
            echo ">> FAIL: harness-import smoke: $HARNESS_REF harness cannot load against @parity/polkadot-app-deploy@$BULLETIN_DEPLOY_VERSION (exit $RC): ${CAUSE:-see log above}"
            exit 1
          fi
          echo "harness from $HARNESS_REF imports cleanly against @parity/polkadot-app-deploy@$BULLETIN_DEPLOY_VERSION"

  # ---- Nightly @ HEAD: coverage for the 11 scenarios that left the PR matrix
  #
  # Runs on ubuntu-latest (GitHub-hosted, free for public repos). These test
  # source code against the testnet. See
  # docs-internal/superpowers/specs/2026-05-22-ci-restructure-design.md.

  nightly-pr-coverage:
    # Reports the actual tested version instead of a blanket "@ HEAD" now that
    # a release/pinned-dispatch run installs @parity/polkadot-app-deploy from
    # npm below (issue #270) rather than always building the checkout.
    # Mirrors bulletin-deploy's identical nightly-pr-coverage job name.
    name: Nightly @ ${{ needs.build-nightly.outputs.test-version || 'HEAD' }} · ${{ matrix.scenario }} ${{ matrix.signer }}/${{ matrix.merkle }}
    # Waits for the full Alice-pool nonce chain (s1-pool→s5→s6→s-ext-signer).
    # E2E_POOL_LABEL (below) uses a dedicated domain (e2eprpool01) to avoid domain
    # contention with nightly-s1-pool on e2epoolns01.dot. But the pool accounts all
    # derive from the same Alice mnemonic, so nonces are still shared — sequencing
    # after s-ext-signer (the last Alice-chain job) is required to prevent Stale tx
    # failures on S5/S9/S8/S-GRANDPA/S-MORTALITY that run concurrently with PR-coverage.
    # Per-leg pool account pinning (#863): each pool leg is pinned to a disjoint
    # //deploy/N account via BULLETIN_POOL_ACCOUNT_INDEX, eliminating intra-matrix
    # nonce collisions without requiring a separate mnemonic provisioning step.
    needs: [build-nightly, select-env, nightly-s-ext-signer, ensure-e2e-authorized, nightly-harness-smoke]
    if: |
      always() && needs.ensure-e2e-authorized.result == 'success' &&
      needs.build-nightly.result == 'success' &&
      contains(fromJSON('["success","skipped"]'), needs.nightly-harness-smoke.result) &&
      (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
    strategy:
      fail-fast: false
      matrix:
        # No env fan-out here: nightly-pr-coverage tests bin/polkadot-app-deploy
        # directly (source-built on schedule/unpinned dispatch, npm-installed on
        # release/pinned dispatch — see BULLETIN_DEPLOY_REF below) rather than
        # the deployed reusable-workflow artifact. Mixing a free env dimension
        # with the include list would produce additive (not cartesian) expansion —
        # GitHub appends include entries that share no keys with the free dimension
        # instead of merging them. Single-env (selected_env) is correct for this job.
        include:
          # Pool legs: each pinned to a disjoint //deploy/N account (#863) via poolIndex.
          # BULLETIN_POOL_ACCOUNT_INDEX=${{ matrix.poolIndex }} in the env block below
          # pins selectAccount() to that index, preventing intra-matrix nonce collisions.
          # Direct legs (s1 direct, s8 direct) and s7 omit poolIndex — unset yields random.
          - { scenario: s1,                       signer: pool,   merkle: js,   poolIndex: 0 }
          - { scenario: s1,                       signer: direct, merkle: kubo }
          - { scenario: s3,                       signer: pool,   merkle: js,   poolIndex: 1 }
          # s7 is signer-agnostic (SIGINT crash-capture); empty matrix.signer
          # produces artifact name `e2e-log-night-s7--js` — mirrors the PR-tier
          # pattern at line 199, not a typo.
          - { scenario: s7,                                       merkle: js }
          - { scenario: s8,                       signer: direct, merkle: js }
          - { scenario: s-inc,                    signer: pool,   merkle: js,   poolIndex: 2 }
          - { scenario: s-inc,                    signer: pool,   merkle: kubo, poolIndex: 3 }
          - { scenario: s-inc-roundtrip,          signer: pool,   merkle: js,   poolIndex: 4 }
          - { scenario: s-inc-portability,        signer: pool,   merkle: js,   poolIndex: 5 }
          - { scenario: s-inc-asset-rotation,     signer: pool,   merkle: js,   poolIndex: 6 }
          - { scenario: s-subdomain,              signer: pool,   merkle: js,   poolIndex: 7 }
          # Pinned to 13, not 8 (bulletin #1637): //deploy/8's nonce is stuck behind
          # immortal third-party txs in one RPC backend's pool. Any unused index would
          # do — the pin only keeps this leg's nonces apart from the concurrent pinned legs.
          - { scenario: s-content-only,           signer: pool,   merkle: js,   poolIndex: 13 }
          - { scenario: s-manifest-env,           signer: pool,   merkle: js,   poolIndex: 9 }
          # No poolIndex: --product-name derives its own signer and refuses a
          # derivation path, so this leg cannot be pinned to a //deploy/N account.
          - { scenario: s-product-manifest,       signer: direct, merkle: js }
          # App v2 PolkaVM manifest publish and executable read-back.
          - { scenario: s-manifest-pvm,           signer: pool,   merkle: js,   poolIndex: 12 }
          # S-TRANSFER: register-as-worker then hand over via the `transfer`
          # command, plus idempotent re-run. Existed in test/e2e.test.js and
          # scripts/e2e-pass.sh since its introduction but was never wired
          # into any CI job — this is its first nightly coverage.
          - { scenario: s-transfer,               signer: pool,   merkle: js,   poolIndex: 10 }
          # S-TRANSFER-SUBNAME (bulletin #150/#151): `transfer`'s subname path
          # via setSubnodeOwner — handover leg + a negative leg asserting the
          # actionable parent-ownership error (not the old misleading
          # "Invalid domain label"). No E2E coverage of this path existed
          # anywhere before this leg.
          - { scenario: s-transfer-subname,       signer: pool,   merkle: js,   poolIndex: 11 }
    steps:
      # BULLETIN_DEPLOY_REF is only ever github.sha (schedule / unpinned
      # dispatch) or empty (release / pinned dispatch — see build-nightly's
      # version-resolution step). An empty `ref:` input is treated by
      # actions/checkout the same as omitting it, i.e. the triggering commit —
      # same as the bare checkout this replaces — so this is a no-op on the
      # source-build path and only changes behavior on the npm-install path
      # below, where the checkout is still needed for this repo's own test
      # files and the local ./.github/actions/npm-retry composite action.
      - uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: Restore Kubo from cache
        if: matrix.merkle == 'kubo'
        uses: actions/cache@v5
        with:
          path: ~/.cache/kubo
          key: kubo-v0.33.0-linux-amd64
      - name: Setup IPFS Kubo
        if: matrix.merkle == 'kubo'
        run: |
          if [ ! -f ~/.cache/kubo/ipfs ]; then
            mkdir -p ~/.cache/kubo
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o /tmp/kubo.tar.gz https://dist.ipfs.tech/kubo/v0.33.0/kubo_v0.33.0_linux-amd64.tar.gz
            tar -xf /tmp/kubo.tar.gz -C /tmp
            cp /tmp/kubo/ipfs ~/.cache/kubo/ipfs
            rm -rf /tmp/kubo /tmp/kubo.tar.gz
          fi
          sudo cp ~/.cache/kubo/ipfs /usr/local/bin/ipfs
          ipfs version
      - name: Initialize IPFS
        if: matrix.merkle == 'kubo'
        run: ipfs init
      - name: Build polkadot-app-deploy from source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - name: Use the test harness from the tag under test (#1621)
        if: env.BULLETIN_DEPLOY_REF == ''
        env:
          HARNESS_REF: ${{ needs.build-nightly.outputs.harness-ref }}
        run: |
          set -euo pipefail
          if [ -z "$HARNESS_REF" ]; then
            echo "::error::published-version path but build-nightly emitted no harness-ref" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$HARNESS_REF:refs/tags/$HARNESS_REF"
          git checkout "$HARNESS_REF" -- . ':(exclude).github'
          echo "Harness (test/, tools/, package.json) from $HARNESS_REF ($(git rev-parse "$HARNESS_REF^{commit}")); workflow + .github from $GITHUB_SHA"
      # On release (and a pinned workflow_dispatch), build-nightly resolves
      # test-version to the RC being gated and this leg must exercise the
      # published tarball's bytes, not a source build of the tag (issue #270 —
      # the gate was validating source, not what `npm install` actually gives
      # consumers). Mirrors nightly-s8/nightly-s9's identical install step.
      - name: Install polkadot-app-deploy from npm
        if: env.BULLETIN_DEPLOY_REF == ''
        uses: ./.github/actions/npm-retry
        with:
          run: |
            V="${BULLETIN_DEPLOY_VERSION:-latest}"
            # ws is a runtime dependency of the published package, but the
            # npm-install path needs it resolvable at the top level for
            # test/helpers/ws-fault-proxy.mjs's bare `import "ws"` — same
            # precaution nightly-s8/nightly-s9 take.
            npm install --no-save "@parity/polkadot-app-deploy@${V}" ws
            # test/e2e.test.js's helpers and bin/polkadot-app-deploy itself
            # resolve relative imports from ../dist — symlink the installed
            # package's dist so those imports run against the published
            # tarball instead of a local build (there is none on this path).
            ln -sf node_modules/@parity/polkadot-app-deploy/dist dist
      - name: Run scenario (one retry on transient testnet failures)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          E2E: "1"
          E2E_RESULT_PATH: ${{ github.workspace }}/e2e-result/e2e-result.json
          E2E_SCENARIO: ${{ matrix.scenario }}
          E2E_SIGNER: ${{ matrix.signer }}
          E2E_MERKLE: ${{ matrix.merkle }}
          PAD_ENV: ${{ needs.select-env.outputs.selected_env }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # Dedicated pool fixture domain — avoids nonce contention with nightly-s1-pool
          # on e2epoolns01.dot. First run registers e2eprpool01.dot automatically.
          E2E_POOL_LABEL: e2eprpool01
          # Per-leg pool account pin (#863): direct/s7 legs omit poolIndex so this
          # yields "" → treated as unset → random selection (unchanged behavior).
          BULLETIN_POOL_ACCOUNT_INDEX: ${{ matrix.poolIndex }}
        with:
          timeout_minutes: 25
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 75
          command: |
            set -o pipefail
            node tools/release-retry-wrapper.mjs node --test test/e2e.test.js 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"
      - name: Upload polkadot-app-deploy forensic log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: e2e-log-night-${{ matrix.scenario }}-${{ matrix.signer }}-${{ matrix.merkle }}
          path: e2e-reports/
          retention-days: 7
          if-no-files-found: ignore
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: ${{ matrix.scenario }}
          env: ${{ needs.select-env.outputs.selected_env }}
          signer: ${{ matrix.signer }}
          merkle: ${{ matrix.merkle }}
          job-name: Nightly @ ${{ needs.build-nightly.outputs.test-version || 'HEAD' }} · ${{ matrix.scenario }} ${{ matrix.signer }}/${{ matrix.merkle }}
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-s1-pool:
    name: Nightly S1 pool/${{ matrix.merkle }} on ${{ matrix.runner }} (${{ matrix.env }})
    needs: [build-nightly, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's1')))
    # No top-level timeout-minutes here: GitHub forbids it on reusable-workflow
    # callers. The cap lives in deploy.yml (timeout-minutes: 30 on the deploy job).
    permissions:
      contents: read
    strategy:
      # All pool legs deploy to e2epoolns01.dot — serialize within the shard to
      # avoid nonce/stale-tx conflicts. Runs concurrently with nightly-s1-direct
      # (which writes its own direct NoStatus label) to cut wall-clock ~50%.
      # max-parallel: 1 serializes across the full matrix (merkle × env), which
      # is safe: env legs are on independent chains and don't nonce-race, but
      # serializing avoids runner queue pressure on the ubuntu-latest pool.
      max-parallel: 1
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        env: ${{ fromJSON(needs.select-env.outputs.healthy_envs) }}
        merkle: [js, kubo]
        runner: ["${{ inputs.runner || 'ubuntu-latest' }}"]
    uses: ./.github/workflows/deploy.yml
    with:
      result-scenario: s1
      result-job-name: Nightly S1 pool/${{ matrix.merkle }} on ${{ matrix.runner }} (${{ matrix.env }})
      artifact-name: e2e-fixture-nightly
      dotns-domain: e2epoolns01
      skip-cache: true
      js-merkle: ${{ matrix.merkle == 'js' }}
      direct-signer: false
      runner: ${{ matrix.runner }}
      tag: ${{ needs.build-nightly.outputs.deploy-tag }}
      env: ${{ matrix.env }}
      polkadot-app-deploy-version: ${{ needs.build-nightly.outputs.test-version }}
      polkadot-app-deploy-ref: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      # Opt-in to flake-class retry: deploy.yml retry wrapper exits 75 on
      # nonce-stale / ChainHead-disjointed / connection-lost / account-mapping
      # errors so nick-fields/retry fires only for those patterns. Any other
      # failure (contract revert, assertion mismatch) fails fast.
      max-retries: 2
    secrets:
      # Fall back to Alice's publicly-known dev mnemonic when DOTNS_MNEMONIC
      # is unset. Testnet-only; consumer workflows set DOTNS_MNEMONIC for their mainnet keys.
      mnemonic: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      sentry-dsn: ${{ secrets.SENTRY_DSN }}

  nightly-s1-direct:
    name: Nightly S1 direct/${{ matrix.merkle }} on ${{ matrix.runner }} (${{ matrix.env }})
    needs: [build-nightly, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's1')))
    # Timeout cap lives in deploy.yml — see nightly-s1-pool note above.
    permissions:
      contents: read
    strategy:
      # All direct legs deploy to e2edirectdp01.dot — serialize within the shard.
      # Runs concurrently with nightly-s1-pool (which writes e2epoolns01.dot). The
      # `derivation-path: //e2e-direct` below gives this shard its own
      # Asset-Hub nonce stream, so DotNS setContenthash here can't race the
      # pool shard's Alice-signed setContenthash. The label is NoStatus on
      # both e2eEligible envs, so this does not rely on POP_RULES self-attestation.
      max-parallel: 1
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        # canary_envs, not healthy_envs (#1624): every LIVE env runs this one S1
        # direct shard, ready or not, so a wrongly-red readiness probe shows up
        # as a green leg on an env the matrix skipped. nightly-report separates
        # these legs from the real scenario failures.
        env: ${{ fromJSON(needs.select-env.outputs.canary_envs) }}
        merkle: [js, kubo]
        runner: ["${{ inputs.runner || 'ubuntu-latest' }}"]
    uses: ./.github/workflows/deploy.yml
    with:
      result-scenario: s1
      result-job-name: Nightly S1 direct/${{ matrix.merkle }} on ${{ matrix.runner }} (${{ matrix.env }})
      artifact-name: e2e-fixture-nightly
      dotns-domain: e2edirectdp01
      derivation-path: //e2e-direct
      skip-cache: true
      js-merkle: ${{ matrix.merkle == 'js' }}
      direct-signer: true
      runner: ${{ matrix.runner }}
      tag: ${{ needs.build-nightly.outputs.deploy-tag }}
      env: ${{ matrix.env }}
      polkadot-app-deploy-version: ${{ needs.build-nightly.outputs.test-version }}
      polkadot-app-deploy-ref: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      # Opt-in to flake-class retry (see nightly-s1-pool comment).
      max-retries: 2
    secrets:
      # Fall back to Alice's publicly-known dev mnemonic when DOTNS_MNEMONIC
      # is unset, so direct-signer legs don't receive `--mnemonic ''`.
      # Testnet-only; consumer workflows set DOTNS_MNEMONIC for their mainnet keys.
      mnemonic: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      sentry-dsn: ${{ secrets.SENTRY_DSN }}

  # Note: there used to be a `nightly-verify` job here that read the on-chain
  # contenthash for e2epool.dot / e2edirect.dot and compared it to an
  # "expected" value computed by build-nightly via merkleizeJS. That check was
  # fundamentally broken: merkleizeJS returns the IPFS directory CID for the
  # fixture, but polkadot-app-deploy writes a different CID (a DAG-PB wrapper over
  # the chunked CAR — the Bulletin-storage representation, not the IPFS
  # directory). The two CIDs can never be equal, so the job always failed in
  # release runs. See issue filed for a proper post-deploy verification that
  # uses each S1 leg's actual output CID.

  nightly-s2-fresh:
    name: Nightly S2 fresh / ${{ matrix.signer }} (${{ matrix.env }})
    needs: [build-nightly, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's2')))
    # Timeout cap lives in deploy.yml — see nightly-s1-pool note above.
    permissions:
      contents: read
    strategy:
      # Per-leg derivation-path below (`//e2e-fresh-pool` / `//e2e-fresh-direct`)
      # gives each leg its own Asset-Hub nonce stream, so the concurrent legs
      # can't race each other (or s1) on a shared Alice nonce. Same rationale
      # as nightly-s1-direct.
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        env: ${{ fromJSON(needs.select-env.outputs.healthy_envs) }}
        signer: [pool, direct]
    uses: ./.github/workflows/deploy.yml
    with:
      result-scenario: s2
      result-job-name: Nightly S2 fresh / ${{ matrix.signer }} (${{ matrix.env }})
      artifact-name: e2e-fixture-nightly
      # Ends in the signer name plus 00 so the final label has base length
      # >= 9 and exactly two trailing digits, classifying as NoStatus on both envs.
      dotns-domain: e2enightly${{ github.run_id }}${{ matrix.signer }}00
      derivation-path: //e2e-fresh-${{ matrix.signer }}
      skip-cache: true
      js-merkle: true
      direct-signer: ${{ matrix.signer == 'direct' }}
      runner: ${{ inputs.runner || 'ubuntu-latest' }}
      tag: ${{ needs.build-nightly.outputs.deploy-tag }}
      env: ${{ matrix.env }}
      polkadot-app-deploy-version: ${{ needs.build-nightly.outputs.test-version }}
      polkadot-app-deploy-ref: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      # Opt-in to flake-class retry (see nightly-s1-pool comment).
      max-retries: 2
    secrets:
      mnemonic: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      sentry-dsn: ${{ secrets.SENTRY_DSN }}

  nightly-s3:
    name: Nightly S3 owned-elsewhere (${{ matrix.env }})
    needs: [build-nightly, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's3')))
    # S3 is a negative test: polkadot-app-deploy MUST reject the deploy to
    # e2eowned.dot (Bob's domain) with exit 78 + "is already owned by
    # 0x41dccbd4...". Previously this was two jobs — a reusable deploy.yml
    # call (which reports conclusion=failure on exit 78) plus a separate
    # verify job that pulled the log and asserted the right error
    # message. That setup rolled the workflow-level aggregate conclusion to
    # 'failure' on every release even when S3 was behaving correctly.
    # Inlining the assertion here lets the job exit 0 when S3 does what
    # it's supposed to do, so the release's aggregate matches reality.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        env: ${{ fromJSON(needs.select-env.outputs.healthy_envs) }}
    env:
      DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      MNEMONIC: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      PAD_ENV: ${{ matrix.env }}
      S3_LABEL: e2eownedns03
    steps:
      # npm-retry is a local action, so this repo must be at the workspace root.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - uses: actions/download-artifact@v8
        with:
          name: e2e-fixture-nightly
          path: build
      - name: Checkout polkadot-app-deploy source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF }}
          path: polkadot-app-deploy-src
      - name: Install polkadot-app-deploy
        uses: ./.github/actions/npm-retry
        with:
          run: |
            if [ -n "$BULLETIN_DEPLOY_REF" ]; then
              echo "Building polkadot-app-deploy from source ref: $BULLETIN_DEPLOY_REF"
              cd polkadot-app-deploy-src
              npm ci
              cd ..
              echo "PAD_BIN=$(pwd)/polkadot-app-deploy-src/bin/polkadot-app-deploy" >> "$GITHUB_ENV"
            elif [ -n "$BULLETIN_DEPLOY_VERSION" ]; then
              echo "Installing @parity/polkadot-app-deploy@$BULLETIN_DEPLOY_VERSION"
              npm install -g "@parity/polkadot-app-deploy@$BULLETIN_DEPLOY_VERSION"
              echo "PAD_BIN=polkadot-app-deploy" >> "$GITHUB_ENV"
            else
              echo "Installing @parity/polkadot-app-deploy (latest stable)"
              npm install -g @parity/polkadot-app-deploy
              echo "PAD_BIN=polkadot-app-deploy" >> "$GITHUB_ENV"
            fi
      - name: Deploy to Bob's domain — expect rejection
        timeout-minutes: 10
        env:
          # 512 MB cap scoped to the test step: exercises polkadot-app-deploy CLI
          # memory-pressure behaviour. At job-level it leaks into npm ci's
          # prepare hook (see PR #408).
          NODE_OPTIONS: --max-old-space-size=512
          # bulletin #1626: this deploy is asserted to fail; tag its spans deploy.expected_error.
          PAD_E2E_EXPECT_FAIL: "1"
        run: |
          set +e
          "$PAD_BIN" --js-merkle --tag "$DEPLOY_TAG" --env "$PAD_ENV" build "$S3_LABEL" > "$RUNNER_TEMP/e2e-leg.log" 2>&1
          EXIT=$?
          set -e
          cat "$RUNNER_TEMP/e2e-leg.log"
          echo "---"
          echo "polkadot-app-deploy exit code: $EXIT"
          # Exit 78 is EXIT_CODE_NO_RETRY, which polkadot-app-deploy uses for
          # owned-elsewhere. Any other exit code means either the deploy
          # succeeded (should have rejected) or rejected for the wrong
          # reason (e.g. network failure) — both are real test failures.
          if [ "$EXIT" != "78" ]; then
            echo "::error::Expected exit 78 (EXIT_CODE_NO_RETRY / owned-elsewhere), got $EXIT"
            exit 1
          fi
          # Bob's H160 from docs/e2e-bootstrap.md; pins the check to the
          # specific owner so a generic "already owned" from a different
          # account doesn't silently pass.
          if ! grep -qi "is already owned by 0x41dccbd49b26c50d34355ed86ff0fa9e489d1e01" "$RUNNER_TEMP/e2e-leg.log"; then
            echo "::error::Expected 'is already owned by 0x41dccbd4...' (Bob's H160) in S3 output"
            exit 1
          fi
          echo "::notice::S3 correctly rejected the deploy with the expected error"
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: s3
          env: ${{ matrix.env }}
          merkle: js
          job-name: Nightly S3 owned-elsewhere (${{ matrix.env }})
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-s5:
    name: Nightly S5 commit-reveal race + retry (${{ matrix.env }})
    # Uses a fresh per-run label so the deploy hits register() (where the
    # commit-reveal retry path lives), not setContenthash.
    # Runs after nightly-s1-pool to avoid Alice-root nonce races: both S5 and
    # S1-pool use the root Alice mnemonic for DotNS and would otherwise start
    # at the same time, causing Stale tx errors. always() ensures S5 still
    # runs even when S1-pool fails.
    needs: [build-nightly, nightly-s1-pool, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's5')))
    # S5 forces the dotns-sdk#105 commit-reveal race by setting buffer=0,
    # which after the isExplicitCommitmentBuffer fix triggers the retry path
    # to escalate to 60s. Validates that the recovery in PR #180 actually
    # works end-to-end against a real chain, not just compiles. See #181
    # Proposal 2.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        env: ${{ fromJSON(needs.select-env.outputs.healthy_envs) }}
    env:
      DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      MNEMONIC: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      PAD_ENV: ${{ matrix.env }}
    steps:
      # npm-retry is a local action, so this repo must be at the workspace root.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - uses: actions/download-artifact@v8
        with:
          name: e2e-fixture-nightly
          path: build
      - name: Checkout polkadot-app-deploy source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF }}
          path: polkadot-app-deploy-src
      - name: Install polkadot-app-deploy
        uses: ./.github/actions/npm-retry
        with:
          run: |
            if [ -n "$BULLETIN_DEPLOY_REF" ]; then
              echo "Building polkadot-app-deploy from source ref: $BULLETIN_DEPLOY_REF"
              cd polkadot-app-deploy-src
              npm ci
              cd ..
              echo "PAD_BIN=$(pwd)/polkadot-app-deploy-src/bin/polkadot-app-deploy" >> "$GITHUB_ENV"
            elif [ -n "$BULLETIN_DEPLOY_VERSION" ]; then
              echo "Installing @parity/polkadot-app-deploy@$BULLETIN_DEPLOY_VERSION"
              npm install -g "@parity/polkadot-app-deploy@$BULLETIN_DEPLOY_VERSION"
              echo "PAD_BIN=polkadot-app-deploy" >> "$GITHUB_ENV"
            else
              echo "Installing @parity/polkadot-app-deploy (latest stable)"
              npm install -g @parity/polkadot-app-deploy
              echo "PAD_BIN=polkadot-app-deploy" >> "$GITHUB_ENV"
            fi
      - name: Deploy with DOTNS_COMMITMENT_BUFFER=0 — expect retry escalation
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          # 512 MB cap scoped to the test step: exercises polkadot-app-deploy CLI
          # memory-pressure behaviour. At job-level it leaks into npm ci's
          # prepare hook (see PR #408).
          NODE_OPTIONS: --max-old-space-size=512
          DOTNS_COMMITMENT_BUFFER: "0"
          # x00 forces NoStatus classification on paseo-next-v2 without
          # depending on POP_RULES self-attestation.
          LABEL: "e2es5${{ github.run_id }}a${{ github.run_attempt }}x00"
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 75
          command: |
            set +e
            "$PAD_BIN" --js-merkle --tag "$DEPLOY_TAG" --env "$PAD_ENV" build "$LABEL" > "$RUNNER_TEMP/e2e-leg.log" 2>&1
            EXIT=$?
            set -e
            cat "$RUNNER_TEMP/e2e-leg.log"
            echo "---"
            echo "polkadot-app-deploy exit code: $EXIT"
            if [ "$EXIT" != "0" ]; then
              # Verbatim from src/dotns.ts double-failure throw — a hard regression
              # if it appears (means both register attempts failed).
              if grep -q "DotNS register failed after retry:" "$RUNNER_TEMP/e2e-leg.log"; then
                echo "::error::S5: actionable-error text means BOTH attempts failed."
                exit 1
              fi
              # Stale nonce (papi 1.x "Invalid: Stale" or papi 2.x JSON format) —
              # transient race on the shared signer account; exit 75 so
              # nick-fields/retry fires.
              if grep -qE '"type": "Stale"|Invalid: Stale' "$RUNNER_TEMP/e2e-leg.log"; then
                echo "::warning::S5: nonce stale — exiting 75 for retry"
                exit 75
              fi
              echo "::error::S5 expected exit 0, got $EXIT"
              exit 1
            fi
            # Verbatim from src/dotns.ts retry log. Whether the race manifests
            # on a given run is timing-dependent (block-time vs wall-clock drift).
            # Buffer=0 doesn't guarantee CommitmentTooNew on the first try; on a
            # fast-producing chain, the reveal can land in time. Surface the
            # outcome as a notice for visibility, but don't fail when the race
            # didn't happen — the retry-path code itself is covered by unit tests.
            if grep -q "with DOTNS_COMMITMENT_BUFFER=60s" "$RUNNER_TEMP/e2e-leg.log"; then
              echo "::notice::S5 retry path fired and recovered"
            else
              echo "::notice::S5 retry path did not fire — race did not manifest this run (timing-dependent)"
            fi
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: s5
          env: ${{ matrix.env }}
          merkle: js
          job-name: Nightly S5 commit-reveal race + retry (${{ matrix.env }})
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-s6:
    name: Nightly S6 RPC failover (${{ matrix.env }})
    # Runs after nightly-s5 (which runs after nightly-s1-pool) to serialize all
