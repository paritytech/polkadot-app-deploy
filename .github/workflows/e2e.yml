      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      MNEMONIC: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # npm-retry is a local action, so this repo must be at the workspace root.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0

      # ---- source-build path (schedule / dispatch without version) ----------
      - name: Checkout polkadot-app-deploy source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF }}
          path: polkadot-app-deploy-src
      - name: Build polkadot-app-deploy from source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: ./.github/actions/npm-retry
        with:
          run: cd polkadot-app-deploy-src && npm ci
      - name: Run S-CAR --input-car scenario (source-build path, one retry on transient testnet failures)
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          E2E: "1"
          E2E_RESULT_PATH: ${{ github.workspace }}/e2e-result/e2e-result.json
          E2E_SCENARIO: s-car
          E2E_SIGNER: pool
          E2E_MERKLE: js
          PAD_ENV: ${{ matrix.env }}
          # No LABEL: the test deploys to the tier's fixed label from
          # tools/lib/e2e-fixtures.mjs (bulletin #1623), keyed on DEPLOY_TAG.
        with:
          timeout_minutes: 40
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 75
          command: |
            set -o pipefail
            cd polkadot-app-deploy-src
            node tools/release-retry-wrapper.mjs node --test test/e2e.test.js 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"

      # ---- npm-install path (release / dispatch with explicit version) ------
      # Installs polkadot-app-deploy locally (not globally) so the CLI binary is
      # available at node_modules/.bin/polkadot-app-deploy and the script can be
      # placed in the same dir to resolve transitive deps.
      - name: Install polkadot-app-deploy from npm (S-CAR)
        if: env.BULLETIN_DEPLOY_REF == ''
        uses: ./.github/actions/npm-retry
        with:
          run: |
            V="${BULLETIN_DEPLOY_VERSION:-latest}"
            echo "Installing @parity/polkadot-app-deploy@$V into /tmp/bd-s-car"
            mkdir -p /tmp/bd-s-car
            echo '{"type":"module"}' > /tmp/bd-s-car/package.json
            cd /tmp/bd-s-car && npm install "@parity/polkadot-app-deploy@${V}"
      - name: Write S-CAR inline test script
        if: env.BULLETIN_DEPLOY_REF == ''
        run: |
          # Write to a file so Node.js resolves 'polkadot-app-deploy' from
          # /tmp/bd-s-car/node_modules (script location = module root).
          # Using a file rather than piped inline code avoids shell-escape
          # hazards (!= etc).
          cat > /tmp/bd-s-car/run-s-car.mjs << 'SCRIPT'
          import path from "path";
          import fs from "fs";
          import { spawnSync } from "child_process";
          import { fileURLToPath, pathToFileURL } from "url";

          const __dirname = path.dirname(fileURLToPath(import.meta.url));
          const BIN = path.join(__dirname, "node_modules", ".bin", "polkadot-app-deploy");

          const PAD_ENV = process.env.PAD_ENV ?? process.env.DOTNS_ENV ?? "paseo-next-v2";
          // bulletin #1623: the tier's fixed Alice-ROOT-owned label, from the same
          // table the source-path test uses.
          const { tieredFixtureLabel } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, "tools/lib/e2e-fixtures.mjs")).href);
          const LABEL = process.env.LABEL || tieredFixtureLabel("s-car", process.env.DEPLOY_TAG);
          const MNEMONIC = process.env.MNEMONIC || "bottom drive obey lake curtain smoke basket hold race lonely fit walk";
          const DEPLOY_TAG = process.env.DEPLOY_TAG || undefined;
          const SENTRY_DSN = process.env.SENTRY_DSN || undefined;
          const CAR_PATH = "/tmp/s-car-npm.car";

          // Create a minimal fixture directory for the first deploy.
          const FIXTURE = "/tmp/s-car-fixture";
          fs.rmSync(FIXTURE, { recursive: true, force: true });
          fs.mkdirSync(FIXTURE, { recursive: true });
          fs.writeFileSync(
            path.join(FIXTURE, "index.html"),
            `<html><body>s-car e2e ${Date.now()}</body></html>`,
          );

          function parseCid(stdout) {
            for (const line of stdout.trim().split("\n").reverse()) {
              const m = line.match(/^CID:\s+(bafy\S+)/);
              if (m) return m[1];
            }
            throw new Error(`Could not parse CID from output. Tail: ${stdout.slice(-500)}`);
          }

          function run(args, extraEnv = {}) {
            const env = {
              ...process.env,
              PAD_ENV,
              ...(DEPLOY_TAG ? { DEPLOY_TAG } : {}),
              ...(SENTRY_DSN ? { SENTRY_DSN } : {}),
              ...extraEnv,
            };
            const r = spawnSync("node", [BIN, ...args], { encoding: "utf8", env, timeout: 35 * 60 * 1000 });
            return { code: r.status ?? 1, stdout: r.stdout ?? "", stderr: r.stderr ?? "" };
          }

          console.log("[S-CAR npm] Step 1: normal deploy + CAR dump");
          const r1 = run(
            [FIXTURE, LABEL, "--js-merkle", "--env", PAD_ENV, "--mnemonic", MNEMONIC],
            { PAD_DUMP_CAR: CAR_PATH },
          );
          process.stdout.write(r1.stdout);
          process.stderr.write(r1.stderr);
          if (r1.code !== 0) throw new Error(`[S-CAR npm] first deploy failed (exit ${r1.code})`);
          if (!fs.existsSync(CAR_PATH)) throw new Error(`[S-CAR npm] PAD_DUMP_CAR did not write ${CAR_PATH}`);
          const cid1 = parseCid(r1.stdout);
          console.log(`[S-CAR npm] cid1 = ${cid1}`);

          console.log("[S-CAR npm] Step 2: --input-car redeploy");
          const r2 = run(
            ["--input-car", CAR_PATH, LABEL, "--env", PAD_ENV, "--mnemonic", MNEMONIC],
          );
          process.stdout.write(r2.stdout);
          process.stderr.write(r2.stderr);
          if (r2.code !== 0) throw new Error(`[S-CAR npm] --input-car deploy failed (exit ${r2.code}). Stderr: ${r2.stderr.slice(-500)}`);
          const cid2 = parseCid(r2.stdout);
          console.log(`[S-CAR npm] cid2 = ${cid2}`);

          if (cid1 !== cid2) {
            throw new Error(`[S-CAR npm] CID mismatch: first=${cid1} second=${cid2}`);
          }
          console.log("[S-CAR npm] PASS: --input-car CID matches normal deploy CID");

          // Cleanup
          fs.rmSync(FIXTURE, { recursive: true, force: true });
          fs.rmSync(CAR_PATH, { force: true });
          SCRIPT
      - name: Run S-CAR --input-car scenario (npm-install path, one retry on transient testnet failures)
        if: env.BULLETIN_DEPLOY_REF == ''
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          PAD_ENV: ${{ matrix.env }}
          # No LABEL: the script reads the tier's fixed label from the
          # checkout's tools/lib/e2e-fixtures.mjs (bulletin #1623), keyed on DEPLOY_TAG.
        with:
          timeout_minutes: 38
          max_attempts: 2
          retry_wait_seconds: 30
          command: |
            set -o pipefail
            node /tmp/bd-s-car/run-s-car.mjs 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: s-car
          env: ${{ matrix.env }}
          job-name: Nightly S-CAR --input-car deploy from pre-built CAR (${{ matrix.env }})
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-s-inc:
    name: Nightly S-INC ${{ matrix.scenario }} / ${{ matrix.merkle }}
    # Waits for nightly-s1-pool (shares Alice/pool mnemonic) and nightly-s-car
    # (further serializes Alice pool nonces in the third Alice-root deploy chain).
    # Single-env: the s-inc/roundtrip/portability/asset-rotation legs share
    # e2eincpool01/e2erotpool01, so a second env would not give them distinct
    # names. s-inc-crosslabel (port of bulletin #1571/#1387) doesn't share that
    # constraint — it builds its own fresh per-run labels via pickFreshRunLabel —
    # but stays in this single-env job because it shares the job's pool signing
    # account. Not also added to nightly-pr-coverage's multi-env matrix: bulletin
    # #1387 asked only for nightly-s-inc coverage. Multi-env coverage for this
    # scenario is a reasonable follow-up, not a gap introduced here.
    # max-parallel: 1 serializes all matrix legs against each other: most legs
    # deploy to the same stable pool labels (e2einc.dot / e2erot.dot or
    # e2eincpool01.dot / e2erotpool01.dot) and would collide if concurrent;
    # s-inc-crosslabel is serialized too so it doesn't race the others for the
    # shared pool account's Asset Hub nonce.
    needs: [build-nightly, nightly-s1-pool, nightly-s-car, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    # Only runs from source (BULLETIN_DEPLOY_REF path); npm-install path does
    # not carry test/e2e.test.js so the run step is skipped.
    # Short-term scope: source-build path only (issue #349 defers npm-install rewrite).
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    # s-inc-asset-rotation deploys a 9.6 MB site; needs more headroom than S-CAR's 45 min.
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        # No env fan-out here: S-INC uses include-based matrix and mixing a free
        # env dimension with include produces additive (not cartesian) expansion —
        # GitHub appends include entries without matching env keys rather than
        # merging them. Single-env (selected_env) avoids that trap.
        include:
          - { scenario: s-inc, merkle: js }
          - { scenario: s-inc, merkle: kubo }
          - { scenario: s-inc-crosslabel, merkle: js }
          - { scenario: s-inc-crosslabel, merkle: kubo }
          - { scenario: s-inc-roundtrip, merkle: js }
          - { scenario: s-inc-portability, merkle: js }
          - { scenario: s-inc-asset-rotation, merkle: js }
    env:
      DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      MNEMONIC: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      # npm-retry is a local action, so this repo must be at the workspace root.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: Checkout polkadot-app-deploy source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF }}
          path: polkadot-app-deploy-src
      - name: Build polkadot-app-deploy from source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: ./.github/actions/npm-retry
        with:
          run: cd polkadot-app-deploy-src && npm ci
      # Kubo legs need the ipfs binary on PATH, or the scenario's Kubo-merkleizer
      # assertion fails the leg. Gated on the source-build ref: it is empty on
      # release / stable-cron / test-version runs, which skip the scenario, so a
      # failed download must not red those runs. Port of bulletin-deploy #1606.
      - name: Restore Kubo from cache
        if: matrix.merkle == 'kubo' && env.BULLETIN_DEPLOY_REF != ''
        uses: actions/cache@v5
        with:
          path: ~/.cache/kubo
          key: kubo-v0.33.0-linux-amd64
      - name: Setup IPFS Kubo
        if: matrix.merkle == 'kubo' && env.BULLETIN_DEPLOY_REF != ''
        run: |
          if [ ! -f ~/.cache/kubo/ipfs ]; then
            mkdir -p ~/.cache/kubo
            curl -fsSL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 300 -o /tmp/kubo.tar.gz https://dist.ipfs.tech/kubo/v0.33.0/kubo_v0.33.0_linux-amd64.tar.gz
            tar -xf /tmp/kubo.tar.gz -C /tmp
            cp /tmp/kubo/ipfs ~/.cache/kubo/ipfs
            rm -rf /tmp/kubo /tmp/kubo.tar.gz
          fi
          sudo cp ~/.cache/kubo/ipfs /usr/local/bin/ipfs
          ipfs version
      - name: Initialize IPFS
        if: matrix.merkle == 'kubo' && env.BULLETIN_DEPLOY_REF != ''
        run: ipfs init
      - name: Run S-INC scenario (one retry on transient testnet failures)
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          E2E: "1"
          E2E_RESULT_PATH: ${{ github.workspace }}/e2e-result/e2e-result.json
          E2E_SCENARIO: ${{ matrix.scenario }}
          E2E_SIGNER: pool
          E2E_MERKLE: ${{ matrix.merkle }}
          PAD_ENV: ${{ needs.select-env.outputs.selected_env }}
          # S-INC scenarios pick their own stable pool labels via pickIncLabel() /
          # pickRotLabel() in test/e2e.test.js — no LABEL env var needed.
        with:
          timeout_minutes: 55
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 75
          command: |
            set -o pipefail
            cd polkadot-app-deploy-src
            node tools/release-retry-wrapper.mjs node --test test/e2e.test.js 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: ${{ matrix.scenario }}
          env: ${{ needs.select-env.outputs.selected_env }}
          signer: pool
          merkle: ${{ matrix.merkle }}
          job-name: Nightly S-INC ${{ matrix.scenario }} / ${{ matrix.merkle }}
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-s-ext-signer:
    name: Nightly S-ext-signer external PolkadotSigner → in-process Revive (${{ matrix.env }})
    # Last in the Alice-root DotNS chain: s1-pool → s5 → s6 → s-ext-signer.
    # All these jobs deploy e2epoolns01.dot (Alice root); running any two concurrently
    # causes Stale tx errors from nonce collisions.
    needs: [build-nightly, nightly-s1-pool, nightly-s1-direct, nightly-s6, select-env, ensure-e2e-authorized]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's-ext-signer')))
    # Verifies the in-process Revive transaction path restored by PR #237.
    # playground-cli uses this path when the user authenticates with a phone
    # signer: it passes a PolkadotSigner object to DotNS.connect() instead of
    # a mnemonic. This test calls DotNS directly via the exported module API
    # so the injected signer reaches the in-process Revive path.
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        env: ${{ fromJSON(needs.select-env.outputs.healthy_envs) }}
    env:
      DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      # npm-retry is a local action, so this repo must be at the workspace root.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0

      # ---- source-build path (schedule / dispatch without version) ----------
      - name: Checkout polkadot-app-deploy source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF }}
          path: polkadot-app-deploy-src
      - name: Build polkadot-app-deploy from source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: ./.github/actions/npm-retry
        with:
          run: cd polkadot-app-deploy-src && npm ci
      - name: Run external signer test (source build, one retry on transient testnet failures)
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          # 512 MB cap scoped to the test step: exercises polkadot-app-deploy CLI
          # memory-pressure behaviour. At job-level it leaks into npm ci's
          # prepare hook (see PR #408).
          NODE_OPTIONS: --max-old-space-size=512
          E2E: "1"
          E2E_RESULT_PATH: ${{ github.workspace }}/e2e-result/e2e-result.json
          E2E_SCENARIO: s7
          E2E_MERKLE: js
          PAD_ENV: ${{ matrix.env }}
        with:
          timeout_minutes: 15
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 75
          command: |
            set -o pipefail
            cd polkadot-app-deploy-src
            node tools/release-retry-wrapper.mjs node --test test/e2e.test.js 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"

      # ---- npm-install path (release / dispatch with explicit version) ------
      # Installs polkadot-app-deploy locally (not globally) so all transitive deps
      # — @polkadot/keyring, polkadot-api, multiformats — land in ./node_modules
      # where the test script can resolve them.
      - name: Install polkadot-app-deploy from npm with polkadot deps
        if: env.BULLETIN_DEPLOY_REF == ''
        uses: ./.github/actions/npm-retry
        with:
          run: |
            V="${BULLETIN_DEPLOY_VERSION:-latest}"
            echo "Installing @parity/polkadot-app-deploy@$V into /tmp/bd-s-ext"
            mkdir -p /tmp/bd-s-ext
            echo '{"type":"module"}' > /tmp/bd-s-ext/package.json
            # Install the product FIRST, then pin polkadot-api to whatever version it
            # actually resolved. A bare `polkadot-api` here takes the registry's latest,
            # which drifted ahead of our dependency range the moment polkadot-api 3.0.0
            # shipped (2026-08-18) and DROPPED the `./signer` subpath — so this scenario's
            # `import { getPolkadotSigner } from "polkadot-api/signer"` dies with
            # ERR_PACKAGE_PATH_NOT_EXPORTED against papi 3 while the product itself is fine
            # on its nested 2.x. Pinning to the resolved version also makes the test honest:
            # an "external PolkadotSigner" must come from the SAME papi instance the product
            # uses, not a different major.
            cd /tmp/bd-s-ext && npm install "@parity/polkadot-app-deploy@${V}" @polkadot/keyring
            PAPI=$(node -p "require('/tmp/bd-s-ext/node_modules/polkadot-api/package.json').version")
            echo "@parity/polkadot-app-deploy@${V} resolved polkadot-api ${PAPI} — pinning the scenario to it"
            cd /tmp/bd-s-ext && npm install "polkadot-api@${PAPI}"
      - name: Write external signer test script
        if: env.BULLETIN_DEPLOY_REF == ''
        run: |
          # Write to a file so Node.js resolves 'polkadot-app-deploy' / '@polkadot/keyring' /
          # 'polkadot-api' from /tmp/bd-s-ext/node_modules (script location = module root).
          # Using a file rather than piped inline code avoids shell-escape hazards (!=, etc).
          cat > /tmp/bd-s-ext/run-s-ext.mjs << 'SCRIPT'
          import { DotNS, loadEnvironments, resolveEndpoints } from "@parity/polkadot-app-deploy";
          import { Keyring } from "@polkadot/keyring";
          import { cryptoWaitReady } from "@polkadot/util-crypto";
          import { getPolkadotSigner } from "polkadot-api/signer";
          import { CID } from "multiformats/cid";
          import { base32 } from "multiformats/bases/base32";
          import { base58btc } from "multiformats/bases/base58";

          const PAD_ENV = process.env.PAD_ENV ?? process.env.DOTNS_ENV ?? "paseo-next-v2";

          function encodeContenthash(cidString) {
            const decoder = cidString.startsWith("Qm") ? base58btc : base32;
            const cid = CID.parse(cidString, decoder);
            const bytes = new Uint8Array(cid.bytes.length + 2);
            bytes[0] = 0xe3; bytes[1] = 0x01;
            bytes.set(cid.bytes, 2);
            return Buffer.from(bytes).toString("hex");
          }

          async function resolveDotnsConnectOptions(envId) {
            const { doc } = await loadEnvironments();
            const resolved = resolveEndpoints(doc, envId);
            return {
              rpc: resolved.assetHub[0],
              assetHubEndpoints: resolved.assetHub,
              autoAccountMapping: resolved.autoAccountMapping,
              contracts: resolved.contracts,
              nativeToEthRatio: resolved.nativeToEthRatio,
            };
          }

          const ALICE_MNEMONIC = "bottom drive obey lake curtain smoke basket hold race lonely fit walk";
          const testCid = "bafybeigdyrzt5sfp7udm7hu76uh7y26nf3efuylqabf3oclgtqy55fbzdi";
          const expected = ("0x" + encodeContenthash(testCid)).toLowerCase();

          await cryptoWaitReady();
          const keyring = new Keyring({ type: "sr25519" });
          const account = keyring.addFromMnemonic(ALICE_MNEMONIC);
          const polkadotSigner = getPolkadotSigner(
            account.publicKey, "Sr25519", async (input) => account.sign(input),
          );

          console.log(`[S-ext-signer] Connecting as ${account.address} via external signer...`);
          const dotns = new DotNS();
          try {
            await dotns.connect({ signer: polkadotSigner, signerAddress: account.address, ...await resolveDotnsConnectOptions(PAD_ENV) });
            await dotns.setContenthash("e2epoolns01", expected);
            console.log("[S-ext-signer] setContenthash via external signer verified on-chain");
          } finally {
            dotns.disconnect();
          }
          SCRIPT
      - name: Run external signer test (npm install)
        if: env.BULLETIN_DEPLOY_REF == ''
        timeout-minutes: 15
        working-directory: /tmp/bd-s-ext
        env:
          # 512 MB cap scoped to the test step: exercises polkadot-app-deploy CLI
          # memory-pressure behaviour. At job-level it leaks into npm ci's
          # prepare hook (see PR #408).
          NODE_OPTIONS: --max-old-space-size=512
          PAD_ENV: ${{ matrix.env }}
        run: |
          set -o pipefail
          node run-s-ext.mjs 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: s-ext-signer
          env: ${{ matrix.env }}
          job-name: Nightly S-ext-signer external PolkadotSigner → in-process Revive (${{ matrix.env }})
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-s-reserved-invariant:
    name: Nightly S-RESERVED-INVARIANT base names <=5 chars stay Reserved (${{ matrix.env }})
    # Port of bulletin-deploy #1423/#1410. UNGATED (unlike S-V060-UNBLOCK,
    # which is dispatch-only and gated on DotNS ABI profile v0.6.0): this
    # scenario guards the OPPOSITE failure — that the v0.6.0 naming change
    # did not accidentally make a governance-reserved name self-registrable
    # — and that invariant holds on every profile, so it runs in normal
    # nightly coverage on every env, every night. Deploys to a fixed,
    # never-registrable label ("web3"): the DotNS preflight abort throws
    # before any chunk upload or registration transaction is attempted, so
    # it never contends for a nonce or a shared domain with any other leg —
    # no scenario-ordering dependency needed (no `needs:` on another
    # nightly-s* job). Port of bulletin-deploy #1588: BULLETIN_POOL_ACCOUNT_INDEX
    # IS pinned below (to pool account 0) even though this scenario never
    # writes — see that env var's own comment for why.
    needs: [build-nightly, select-env, ensure-e2e-authorized, nightly-harness-smoke]
    if: always() && needs.ensure-e2e-authorized.result == 'success' && needs.build-nightly.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.nightly-harness-smoke.result) && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly')) && (github.event_name != 'workflow_dispatch' || inputs.scenarios == '' || contains(format(',{0},', inputs.scenarios), format(',{0},', 's-reserved-invariant')))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # env fans out on schedule, single-env on release/dispatch (see select-env).
        env: ${{ fromJSON(needs.select-env.outputs.healthy_envs) }}
    env:
      DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
      BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
      BULLETIN_DEPLOY_REF: ${{ needs.build-nightly.outputs.polkadot-app-deploy-ref }}
      MNEMONIC: ${{ secrets.DOTNS_MNEMONIC || 'bottom drive obey lake curtain smoke basket hold race lonely fit walk' }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ env.BULLETIN_DEPLOY_REF || '' }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: Build polkadot-app-deploy from source
        if: env.BULLETIN_DEPLOY_REF != ''
        uses: ./.github/actions/npm-retry
        with:
          run: SKIP_ENVIRONMENTS_PREFETCH=1 npm ci
      - name: Use the test harness from the tag under test (#1621)
        if: env.BULLETIN_DEPLOY_REF == ''
        env:
          HARNESS_REF: ${{ needs.build-nightly.outputs.harness-ref }}
        run: |
          set -euo pipefail
          if [ -z "$HARNESS_REF" ]; then
            echo "::error::published-version path but build-nightly emitted no harness-ref" >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/$HARNESS_REF:refs/tags/$HARNESS_REF"
          git checkout "$HARNESS_REF" -- . ':(exclude).github'
          echo "Harness (test/, tools/, package.json) from $HARNESS_REF ($(git rev-parse "$HARNESS_REF^{commit}")); workflow + .github from $GITHUB_SHA"
      - name: Install polkadot-app-deploy from npm
        if: env.BULLETIN_DEPLOY_REF == ''
        uses: ./.github/actions/npm-retry
        with:
          run: |
            V="${BULLETIN_DEPLOY_VERSION:-latest}"
            npm install --no-save "@parity/polkadot-app-deploy@${V}" ws
            ln -sf node_modules/@parity/polkadot-app-deploy/dist dist
      - name: Run S-RESERVED-INVARIANT scenario (one retry on transient testnet failures)
        # retry_on_exit_code: 75 matches every sibling nightly-s* leg's convention
        # (release-retry-wrapper.mjs re-exits 75 for failures it classifies as
        # transient). Deliberately NOT adding an explicit retry_on: any here,
        # matching the source job's own note (bulletin #1410): retry_on_exit_code
        # gates on the exact exit code regardless of retry_on's value, so a
        # genuine timeout (the wrapped process never reports 75 when killed)
        # still won't retry on ANY of these sibling legs, not just this one.
        # Closing that gap repo-wide is a separate, out-of-scope follow-up.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        env:
          E2E: "1"
          E2E_RESULT_PATH: ${{ github.workspace }}/e2e-result/e2e-result.json
          E2E_SCENARIO: s-reserved-invariant
          E2E_SIGNER: pool
          E2E_MERKLE: js
          PAD_ENV: ${{ matrix.env }}
          # #1588 (port of bulletin-deploy): pin to pool account 0 (#863's
          # BULLETIN_POOL_ACCOUNT_INDEX mechanism) instead of the unpinned
          # default (bare Alice). This job must never write: connect()'s
          # account-mapping check runs BEFORE the Reserved refusal, and an
          # unmapped/underfunded signer would submit a real mapping/top-up
          # tx there. Index 0 is deliberately picked from the STANDARD pool
          # (0-9) that bin/polkadot-app-bootstrap provisions everywhere by
          # default — no new provisioning needed on any env. Index 0 is
          # also nightly-pr-coverage's s1-pool-js leg (a concurrent
          # WRITER), but sharing it is safe here specifically BECAUSE this
          # scenario is read-only by design: it never signs or submits
          # anything (test/e2e.test.js asserts the absence of every
          # mapping/top-up log marker), so it can't race s1-pool-js's
          # nonce — a nonce assertion would have made this unsafe to
          # share, which is why there isn't one.
          BULLETIN_POOL_ACCOUNT_INDEX: "0"
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
        with:
          timeout_minutes: 10
          max_attempts: 2
          retry_wait_seconds: 30
          retry_on_exit_code: 75
          command: |
            set -o pipefail
            node tools/release-retry-wrapper.mjs node --test test/e2e.test.js 2>&1 | tee "$RUNNER_TEMP/e2e-leg.log"
      - name: Write e2e-result.json (#1625)
        if: always()
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: s-reserved-invariant
          env: ${{ matrix.env }}
          signer: pool
          merkle: js
          job-name: Nightly S-RESERVED-INVARIANT base names <=5 chars stay Reserved (${{ matrix.env }})
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log

  nightly-report:
    name: Nightly E2E Report
    needs: [build-nightly, select-env, ensure-e2e-authorized, nightly-s1-pool, nightly-s1-direct, nightly-s2-fresh, nightly-s3, nightly-s5, nightly-s6, nightly-s7, nightly-s8, nightly-s9, nightly-s-grandpa-reupload, nightly-s-mortality, nightly-s-reprove, nightly-s-car, nightly-s-inc, nightly-s-ext-signer, nightly-s-reserved-invariant, nightly-harness-smoke, nightly-verify-telemetry, nightly-verify-pool-distribution, nightly-pr-coverage, nightly-code-path-coverage]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # actions:read — needed for GET /runs/{id}/jobs (fetch per-leg results)
      actions: read
      # issues:write — needed to open failure issues on schedule/release triggers
      issues: write
      # checks:read — GET /check-runs/{id}/annotations for the runner-loss classifier (bulletin #1622)
      checks: read
      # contents:read — sparse checkout of .github/scripts for the runner-loss classifier (bulletin #1622)
      contents: read
    steps:
      # Checked out and set up FIRST: the Fetch step below runs
      # .github/scripts/e2e-result.mjs (#1625), and the runner-loss classifier
      # further down (#1622) uses the same checkout. package.json carries
      # "type": "module", which the .js harness helper the script imports needs.
      - name: Check out the report scripts
        if: always()
        continue-on-error: true
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
            package.json
            test/helpers/e2e-failure.js
            tools/release-retry-wrapper.mjs
          sparse-checkout-cone-mode: false
      - name: Set up Node for the report scripts
        if: always()
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          # package.json is in the sparse checkout, so setup-node would try to cache
          # npm and annotate an error: there is no lockfile here.
          package-manager-cache: false
      # Per-leg result files (#1625). continue-on-error: no artifact at all
      # (every leg lost its runner, or a pre-#1625 ref) must not kill the report;
      # the Fetch step then falls back to the log grep for every red leg.
      - name: Download per-leg result files
        if: always()
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: e2e-result-*
          merge-multiple: true
          path: e2e-results
      - name: Fetch per-leg job results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED_ENV: ${{ needs.select-env.outputs.selected_env }}
        # Same robustness fix as pr-report: use curl + pipefail so a
        # missing-gh-binary regression on the runner can't silently
        # produce empty TSVs and a headerless report.
        shell: /usr/bin/bash -euo pipefail {0}
        run: |
          # Fetch up to 200 jobs (two pages) to cover the expanded matrix
          # when healthy_envs has 2+ entries and every scenario fans out.
          curl -fsSL \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100&page=1" \
            > /tmp/jobs-p1.json
          curl -fsSL \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100&page=2" \
            > /tmp/jobs-p2.json
          jq -s '.[0].jobs + .[1].jobs | {jobs: .}' /tmp/jobs-p1.json /tmp/jobs-p2.json > /tmp/jobs.json
          jq -r '.jobs[] | select(.name | startswith("Nightly S1 ")) | "\(.name)\t\(.conclusion)"' \
            /tmp/jobs.json > /tmp/s1-legs.tsv
          jq -r '.jobs[] | select(.name | startswith("Nightly S2 fresh ")) | "\(.name)\t\(.conclusion)"' \
            /tmp/jobs.json > /tmp/s2-legs.tsv
          # Per-env breakdown (issue #1055): classify every "Nightly …" job
          # ONCE, here, into a 3rd column — the env parsed from its "(<env>)"
          # name suffix, $SELECTED_ENV for the env-fixed scenarios (S-INC,
          # PR-coverage) that carry no suffix, or META for jobs that aren't
          # scoped to a single env (telemetry/pool-dist/code-path/DotNS-drift/
          # this report job itself). Computed once and reused downstream by
          # the render step (env filter = exact match on this column) instead
          # of re-deriving env/meta from the name string in multiple places.
          jq -r '.jobs[] | select(.name | test("^Nightly ")) | "\(.name)\t\(.conclusion)"' /tmp/jobs.json |
          awk -F'\t' -v selected="$SELECTED_ENV" '
            BEGIN { OFS="\t" }
            {
              name = $1; conclusion = $2
              meta = (index(name,"telemetry assertions")>0) || (index(name,"pool selection")>0) || \
                     (index(name,"code-path")>0) || (index(name,"harness-import smoke")>0) || (index(name,"E2E Report")>0) || (index(name,"DotNS address drift")>0)
              env_tag = "META"
              if (!meta) {
                env_tag = selected
                n = length(name)
                if (substr(name, n, 1) == ")") {
                  for (i = n; i >= 1; i--) {
                    if (substr(name, i, 1) == "(") {
                      env_tag = substr(name, i + 1, n - i - 1)
                      break
                    }
                  }
                }
              }
              print name, conclusion, env_tag
            }' > /tmp/all-nightly-legs.tsv

          # One-line failure signature per failing leg (issue #1055).
          #
          # Primary source (bulletin #1625): the e2e-result-*.json each scenario leg
          # uploaded (class, signature, run_attempt; see .github/scripts/e2e-result.mjs).
          # Fallback, ONLY for a red leg with no result file or an empty
          # signature (a lost runner, a pre-#1625 harness, a leg that died before
          # the writer ran): fetch the job's raw log and grab the last
          # `>> FAIL: …` / `Deployment failed: …` line. At most 20 log fetches,
          # because that loop is sequential and a report that dies mid-fetch
          # files nothing.
          node .github/scripts/e2e-result.mjs index e2e-results > /tmp/result-index.tsv 2>/dev/null || : > /tmp/result-index.tsv
          jq -r '.jobs[] | select(.name | test("^Nightly ")) | select(.conclusion == "failure" or .conclusion == "cancelled") | "\(.id)\t\(.name)"' \
            /tmp/jobs.json > /tmp/red-jobs.tsv
          : > /tmp/fail-signatures.tsv
          : > /tmp/fail-causes.tsv
          FROM_FILE=0; FROM_LOG=0; LOG_FETCHES=0
          while IFS=$'\t' read -r job_id job_name; do
            # The reusable deploy workflow's jobs surface as "<caller> / Deploy on <env>".
            NORM=$(printf '%s' "$job_name" | sed -E 's# / Deploy on [^ ]+$##')
            ROW=$(awk -F'\t' -v n="$NORM" '$1==n{print; exit}' /tmp/result-index.tsv)
            CLASS=$(printf '%s' "$ROW" | cut -f2)
            SIG=$(printf '%s' "$ROW" | cut -f3)
            if [ -n "$SIG" ]; then
              FROM_FILE=$((FROM_FILE + 1))
            else
              FROM_LOG=$((FROM_LOG + 1))
              if [ "$LOG_FETCHES" -lt 20 ]; then
                LOG_FETCHES=$((LOG_FETCHES + 1))
                SIG=$(curl -fsSL \
                  -H "Authorization: bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "${{ github.api_url }}/repos/${{ github.repository }}/actions/jobs/${job_id}/logs" 2>/dev/null \
                  | grep -aE '>> FAIL:|Deployment failed' \
                  | tail -n 1 \
                  | tr -d '\r' \
                  | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:.]+Z[[:space:]]*//' \
                  || true)
              fi
            fi
            # Cause class: the result file's, refined from the signature text when
            # that says nothing (so a fallback signature still buckets, and a
            # runner-loss annotation maps to runner_loss).
            if [ -z "$CLASS" ] || [ "$CLASS" = unknown ] || [ "$CLASS" = pass ]; then
              CLASS=unknown
              if [ -n "$SIG" ]; then
                CLASS=$(node .github/scripts/e2e-result.mjs classify-text "$SIG" 2>/dev/null || echo unknown)
              fi
            fi
            SIG="${SIG:-(no failure signature found in logs — open the run)}"
            printf '%s\t%s\n' "$job_name" "$SIG" >> /tmp/fail-signatures.tsv
            # Dominant cause (#1625) counts scenario legs only: META verdicts
            # (telemetry/pool-distribution/code-path/...) are downstream symptoms.
            ENV_TAG=$(awk -F'\t' -v n="$job_name" '$1==n{print $3; exit}' /tmp/all-nightly-legs.tsv)
            if [ "$ENV_TAG" != META ]; then
              printf '%s\t%s\n' "$job_name" "$CLASS" >> /tmp/fail-causes.tsv
            fi
          done < /tmp/red-jobs.tsv
          {
            echo "result files read: $(grep -c . /tmp/result-index.tsv || true) leg(s) (latest attempt each)"
            echo "signatures: ${FROM_FILE} from result files, ${FROM_LOG} from log fallback"
          } | tee /tmp/signature-sources.txt

          : > /tmp/dominant-cause.md
          : > /tmp/dominant-cause.label
          DOM=$(node .github/scripts/e2e-result.mjs dominant /tmp/fail-causes.tsv 2>/dev/null || true)
          if [ -n "$DOM" ]; then
            IFS=$'\t' read -r D_CLASS D_N D_M D_LABEL <<< "$DOM"
            echo "Dominant cause: ${D_CLASS} (${D_N} of ${D_M} red legs)" > /tmp/dominant-cause.md
            echo "$D_LABEL" > /tmp/dominant-cause.label
            cat /tmp/dominant-cause.md
          fi

      - name: Render report body
        env:
          NIGHTLY_S1_POOL:        ${{ needs.nightly-s1-pool.result }}
          NIGHTLY_S1_DIRECT:      ${{ needs.nightly-s1-direct.result }}
          NIGHTLY_S2:             ${{ needs.nightly-s2-fresh.result }}
          VERIFY_S3:              ${{ needs.nightly-s3.result }}
          NIGHTLY_S5:             ${{ needs.nightly-s5.result }}
          NIGHTLY_S6:             ${{ needs.nightly-s6.result }}
          NIGHTLY_S7:             ${{ needs.nightly-s7.result }}
          NIGHTLY_S8:             ${{ needs.nightly-s8.result }}
          NIGHTLY_S9:             ${{ needs.nightly-s9.result }}
          NIGHTLY_S_GRANDPA_REUPLOAD: ${{ needs.nightly-s-grandpa-reupload.result }}
          NIGHTLY_S_MORTALITY:    ${{ needs.nightly-s-mortality.result }}
          NIGHTLY_S_REPROVE:      ${{ needs.nightly-s-reprove.result }}
          NIGHTLY_S_CAR:          ${{ needs.nightly-s-car.result }}
          NIGHTLY_S_INC:          ${{ needs.nightly-s-inc.result }}
          NIGHTLY_S_EXT_SIGNER:   ${{ needs.nightly-s-ext-signer.result }}
          NIGHTLY_S_RESERVED_INVARIANT: ${{ needs.nightly-s-reserved-invariant.result }}
          NIGHTLY_HARNESS_SMOKE:  ${{ needs.nightly-harness-smoke.result }}
          NIGHTLY_TELEMETRY:      ${{ needs.nightly-verify-telemetry.result }}
          NIGHTLY_POOL_DIST:      ${{ needs.nightly-verify-pool-distribution.result }}
          NIGHTLY_PR_COVERAGE:    ${{ needs.nightly-pr-coverage.result }}
          NIGHTLY_CODE_PATH:      ${{ needs.nightly-code-path-coverage.result }}
          TAG:                    ${{ needs.build-nightly.outputs.deploy-tag }}
          VERSION:                ${{ needs.build-nightly.outputs.test-version }}
          RUN_URL:                ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SELECTED_ENV:           ${{ needs.select-env.outputs.selected_env }}
          HEALTHY_ENVS:           ${{ needs.select-env.outputs.healthy_envs }}
          NOT_READY:              ${{ needs.select-env.outputs.not_ready }}
        run: |
          emoji() { case "$1" in
            success)   echo "✅ PASS";;
            failure)   echo "❌ FAIL";;
            skipped)   echo "⏭️ SKIP";;
            cancelled) echo "🚫 CANCEL";;
            *)         echo "❓ $1";;
          esac; }

          VERSION_LABEL="${VERSION:-latest stable}"
          case "$TAG" in
            e2e-ci-release)  TITLE="Release E2E Test Pass · \`$VERSION_LABEL\`";;
            e2e-ci-dispatch) TITLE="Dispatched E2E Test Pass · \`$VERSION_LABEL\`";;
            *)               TITLE="Nightly E2E Test Pass · \`$VERSION_LABEL\`";;
          esac

          # Environment readiness (#1624). Built once into a file: it goes into the
          # report body below AND into the env-not-ready issue. Empty when every
          # live env was ready (or the check did not run).
          : > /tmp/readiness-section.md
          if [ -n "${NOT_READY:-}" ] && [ "$NOT_READY" != "{}" ] && echo "$NOT_READY" | jq -e 'length > 0' >/dev/null 2>&1; then
            {
              echo "## Environment readiness"
              echo ""
              echo "These envs are live but failed the readiness check, so the scenario matrix was NOT run on them (the S1 direct canary still was; its result is the last column, and a green canary on a not-ready env means the probe may be wrong)."
              echo ""
              echo "| Env | Failed check | Values read | Canary (S1 direct legs) |"
              echo "|-----|--------------|-------------|--------------------------|"
              for nr_env in $(echo "$NOT_READY" | jq -r 'keys[]'); do
                CANARY=$(awk -F'\t' -v e="$nr_env" '$1 ~ /^Nightly S1 direct/ && $3==e { c[$2]++ } END { for (k in c) print c[k] " " k }' /tmp/all-nightly-legs.tsv | sort -k2 | paste -sd ',' - | sed 's/,/, /g')
                CANARY="${CANARY:-not run}"
                echo "$NOT_READY" | jq -r --arg e "$nr_env" --arg canary "$CANARY" '.[$e][] | "| \($e) | \(.check) | \(.reason | gsub("\\|"; "/")) | \($canary) |"'
              done
              echo ""
            } > /tmp/readiness-section.md
          fi

          # Rendered once and reused for the step summary AND the failure-issue
          # body, so both surfaces show the same per-leg table.
          {
            echo "# $TITLE"
            echo ""
            echo "Tag: \`$TAG\` · Run: [${{ github.run_id }}]($RUN_URL)"
            echo ""
            # Show which envs the nightly ran on. ENV_LIST is the source list;
            # HEALTHY_LIST just reformats it — one JSON parse, not two.
            ENV_LIST=$(echo "$HEALTHY_ENVS" | python3 -c "import json,sys; print('\n'.join(json.load(sys.stdin)))" 2>/dev/null || echo "$SELECTED_ENV")
            HEALTHY_LIST=$(printf '%s\n' "$ENV_LIST" | paste -sd ',' - | sed 's/,/, /g')
            echo "Environments: $HEALTHY_LIST | Fixed scenarios (S-INC, PR-coverage) on: $SELECTED_ENV"
            echo ""
            # Per-environment status header (issue #1055): /tmp/all-nightly-legs.tsv
            # already carries a 3rd column classifying each row's env — either
            # the "(<env>)" name suffix, $SELECTED_ENV for the env-fixed
            # scenarios (S-INC, PR-coverage), or META for jobs that aren't
            # scoped to a single env (telemetry, pool distribution, code-path,
            # DotNS drift, this report job itself). That classification is
            # computed once, upstream in the Fetch step; here we only filter
            # and count — no re-parsing of job names, so it can't drift out of
            # sync with the failing-legs table below (which reads the same
            # column). META failures get their own line so a global failure
            # there can never render as "all green".
            join_semi() { paste -sd '|' - | sed 's/|/; /g'; }
            cat /tmp/readiness-section.md
            echo "Environment status:"
            while IFS= read -r env; do
              [ -z "$env" ] && continue
              MATCHING=$(awk -F'\t' -v env="$env" '$3==env' /tmp/all-nightly-legs.tsv)
              TOTAL=$(printf '%s\n' "$MATCHING" | grep -c . || true)
              FAILS=$(printf '%s\n' "$MATCHING" | awk -F'\t' '$2=="failure"||$2=="cancelled"{print $1}')
              FAIL_COUNT=$(printf '%s\n' "$FAILS" | grep -c . || true)
              if [ "$FAIL_COUNT" -gt 0 ]; then
                NAMES=$(printf '%s\n' "$FAILS" | sed -E 's/ *\([^()]*\)$//' | sort -u | join_semi)
                echo "- ${env}: ❌ ${FAIL_COUNT} scenario(s) red (${NAMES})"
              else
                echo "- ${env}: ✅ all green (${TOTAL} legs)"
              fi
            done <<< "$ENV_LIST"
            META_FAILS=$(awk -F'\t' '$3=="META" && ($2=="failure"||$2=="cancelled"){print $1}' /tmp/all-nightly-legs.tsv)
            if [ -n "$META_FAILS" ]; then
              META_NAMES=$(printf '%s\n' "$META_FAILS" | sort -u | join_semi)
              echo "- process-level (non-env): ❌ ${META_NAMES}"
            fi
            echo ""
            echo "## Aggregate results"
            echo ""
            echo "| Scenario | Result |"
            echo "|----------|--------|"
            echo "| S1 pool shard (4 legs) | $(emoji "$NIGHTLY_S1_POOL") |"
            echo "| S1 direct shard (4 legs) | $(emoji "$NIGHTLY_S1_DIRECT") |"
            echo "| S2 fresh (pool + direct) | $(emoji "$NIGHTLY_S2") |"
            echo "| S3 owned-elsewhere | $(emoji "$VERIFY_S3") |"
            echo "| S5 commit-reveal race + retry | $(emoji "$NIGHTLY_S5") |"
            echo "| S6 RPC failover | $(emoji "$NIGHTLY_S6") |"
            echo "| S7 SIGINT crash-capture | $(emoji "$NIGHTLY_S7") |"
            echo "| S8 WS fault injection | $(emoji "$NIGHTLY_S8") |"
            echo "| S9 parallel nonce-collision resilience | $(emoji "$NIGHTLY_S9") |"
            echo "| S-GRANDPA-REUPLOAD stale finalized head | $(emoji "$NIGHTLY_S_GRANDPA_REUPLOAD") |"
            echo "| S-MORTALITY chunk tx mortal era expiry retry | $(emoji "$NIGHTLY_S_MORTALITY") |"
            echo "| S-REPROVE auto-reprove stale alias | $(emoji "$NIGHTLY_S_REPROVE") |"
            echo "| S-CAR --input-car deploy | $(emoji "$NIGHTLY_S_CAR") |"
            echo "| S-INC scenarios (5 legs: s-inc js/kubo, roundtrip, portability, asset-rotation) | $(emoji "$NIGHTLY_S_INC") |"
            echo "| S-ext-signer external PolkadotSigner | $(emoji "$NIGHTLY_S_EXT_SIGNER") |"
            echo "| S-RESERVED-INVARIANT base names <=5 chars stay Reserved | $(emoji "$NIGHTLY_S_RESERVED_INVARIANT") |"
            echo "| Harness-import smoke (published-version tier; skipped on source builds) | $(emoji "$NIGHTLY_HARNESS_SMOKE") |"
            echo "| Telemetry assertions | $(emoji "$NIGHTLY_TELEMETRY") |"
            echo "| Pool selection distribution | $(emoji "$NIGHTLY_POOL_DIST") |"
            echo "| Nightly @ HEAD PR-coverage (11 legs) | $(emoji "$NIGHTLY_PR_COVERAGE") |"
            echo "| Code-path coverage (dead-branch alarm) | $(emoji "$NIGHTLY_CODE_PATH") |"
            echo ""
            echo "## S1 cube — per-leg"
            echo ""
            echo "| Leg | Result |"
            echo "|-----|--------|"
            while IFS=$'\t' read -r name conclusion; do
              echo "| $name | $(emoji "$conclusion") |"
            done < /tmp/s1-legs.tsv
            echo ""
            echo "## S2 fresh — per-leg"
            echo ""
            echo "| Leg | Result |"
            echo "|-----|--------|"
            while IFS=$'\t' read -r name conclusion; do
              echo "| $name | $(emoji "$conclusion") |"
            done < /tmp/s2-legs.tsv
            echo ""
            # Per-env breakdown: group failing/cancelled legs so readers can
            # tell which env hit. Reads the same env_tag column the header
            # above does, so a leg's env label can't disagree between the
            # two sections.
            FAIL_LEGS=$(awk -F'\t' '$2=="failure"||$2=="cancelled"' /tmp/all-nightly-legs.tsv || true)
            if [ -n "$FAIL_LEGS" ]; then
              echo "## Failing legs by env"
              echo ""
              echo "| Leg | Result |"
              echo "|-----|--------|"
              while IFS=$'\t' read -r name conclusion env_tag; do
                # Annotate legs whose name doesn't already show an env (the
                # env-fixed scenarios — S-INC, PR-coverage); META and
                # already-tagged names are left as-is.
                display_name="$name"
                if [ "$env_tag" != "META" ] && [[ "$name" != *"($env_tag)" ]]; then
                  display_name="$name (on ${env_tag})"
                fi
                echo "| $display_name | $(emoji "$conclusion") |"
              done <<< "$FAIL_LEGS"
              echo ""
              # One-line failure signature per failing leg (issue #1055),
              # looked up by the raw (un-annotated) job name so it matches
              # what the Fetch step keyed /tmp/fail-signatures.tsv on.
              if [ -f /tmp/fail-signatures.tsv ] && [ -s /tmp/fail-signatures.tsv ]; then
                echo "### Failure signatures"
                echo ""
                while IFS=$'\t' read -r name conclusion env_tag; do
                  SIG=$(awk -F'\t' -v n="$name" '$1==n{print $2; exit}' /tmp/fail-signatures.tsv)
                  [ -n "$SIG" ] && echo "- **$name**: $SIG"
                done <<< "$FAIL_LEGS"
                echo ""
              fi
            fi
            echo "**Sentry:** [E2E Health dashboard](https://paritytech.sentry.io/dashboard/1732713/?project=4511093597405264) · [raw traces](https://paritytech.sentry.io/explore/traces/?project=4511093597405264&query=deploy.tag%3A$TAG)"
          } > /tmp/report-body.md

          {
            if [ -s /tmp/dominant-cause.md ]; then cat /tmp/dominant-cause.md; echo ""; fi
            cat /tmp/report-body.md
            echo ""
            cat /tmp/signature-sources.txt 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the failure-issue title
        # The title below is free text — decorative, for humans reading the
        # issue list. It is NOT the dedup key. Open and Note both match the
        # issue on DEDUP_LABEL, computed further down. Reword TITLE freely;
        # do not let dedup logic creep back onto it. (port of bulletin #1512,
        # #1523, #1536, adapted: the twin has only two tiers — release and
        # nightly — not bulletin's release/stable/head three, because the
        # twin's schedule trigger always source-builds main HEAD, never
        # tests a published @latest on a cron.)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'release')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ needs.build-nightly.outputs.test-version }}
        run: |
          # Key the title's date on the RUN's own created_at rather than wall
          # clock at the moment this step executes (port of bulletin #1516).
          # GitHub sets a run's created_at once, when the run is first
          # created, and it does not change across run_attempts — unlike a
          # bare `date -u`, which a re-run crossing 00:00 UTC after attempt 1
          # would evaluate to a different day, missing the issue attempt 1
          # filed and filing a duplicate instead. This is a separate call
          # from the "Fetch per-leg job results" step's
          # /actions/runs/{run_id}/jobs calls — that endpoint lists jobs, and
          # a job's own created_at reflects when that job's latest attempt
          # was queued, not the run's.
          # Falls back to wall clock if the API cannot be reached. This step
          # runs on every scheduled and release run, green or red, and the
          # step after it refuses to file the failure issue without the
          # title this one exports — so letting a transient 5xx kill the
          # step would trade a duplicate issue for no issue at all on a
          # night that had real failures.
          RUN_CREATED_AT=$(curl -fsSL --max-time 30 \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPO/actions/runs/$GITHUB_RUN_ID" | jq -r '.created_at' || true)
          if [ -z "$RUN_CREATED_AT" ] || [ "$RUN_CREATED_AT" = "null" ]; then
            echo "::warning::could not read the run's created_at — falling back to wall clock for the issue-title date"
            TODAY=$(date -u +%Y-%m-%d)
          else
            TODAY=$(date -u -d "$RUN_CREATED_AT" +%Y-%m-%d)
          fi

          # Each branch also sets DEDUP_KEY — the identity that must stay
          # constant across this run's own attempts/re-triggers, but change
          # from one genuinely distinct occurrence to the next. For release
          # that's the version, not the date: a UTC day can see multiple RC
          # prereleases (successive rc.N bumps, each firing this workflow on
          # `release: prereleased`), and keying on TODAY would wrongly
          # collapse their distinct failures onto one issue. For nightly,
          # one run per day is the natural unit, so TODAY is right. Do NOT
          # key on run_id instead: a scheduled run that gets manually
          # re-triggered becomes a new run with a new run_id, and it must
          # still dedupe onto the same issue.
          if [ "$EVENT" = release ]; then
            TIER=release
            VERSION_LABEL="${VERSION:-${RELEASE_TAG#v}}"
            TITLE="Release E2E failure: $VERSION_LABEL"
            DEDUP_KEY="$VERSION_LABEL"
          else
            TIER=nightly
            VERSION_LABEL="${VERSION:-main@${GITHUB_SHA:0:7} (source build)}"
            TITLE="Nightly E2E failure: ${TODAY}"
            DEDUP_KEY="$TODAY"
          fi

          # GitHub label names cap at 50 chars, and the issues-list `labels=`
          # query param below uses a comma to AND multiple labels together —
          # strip commas so an unexpected one in DEDUP_KEY can't be misread
          # as a label separator.
          DEDUP_LABEL="nightly-dedup:${TIER}:${DEDUP_KEY//,/}"
          DEDUP_LABEL="${DEDUP_LABEL:0:50}"

          {
            echo "ISSUE_TITLE=$TITLE"
            echo "TIER=$TIER"
            echo "TODAY=$TODAY"
            echo "VERSION_LABEL=$VERSION_LABEL"
            echo "DEDUP_LABEL=$DEDUP_LABEL"
          } >> "$GITHUB_ENV"

      # Runner-loss verdict (port of bulletin #1638 / #1622). Logs on every event;
      # on a first-attempt SCHEDULED run whose every red leg is a lost runner, the
      # failure issue below is skipped because e2e-runner-loss-rerun.yml will
      # re-run the failed jobs. This job cannot issue that re-run itself:
      # rerun-failed-jobs is refused while the run (which contains this job) is
      # still in progress. Both workflows use the same classifier script, so
      # they agree about the run; if the re-run POST fails, that workflow files
      # the issue itself. Release runs are never skipped or auto-re-run: the
      # release gate is judged by a human.
      # continue-on-error on all three steps: a classifier hiccup must never
      # suppress an issue, because anything but "all-runner-loss" files as before.
      - name: Classify runner loss
        id: runner-loss
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          node .github/scripts/classify-runner-loss.cjs | tee /tmp/runner-loss.txt
          if [ "$EVENT" = schedule ] && [ "$ATTEMPT" = 1 ] && grep -q 'verdict=all-runner-loss' /tmp/runner-loss.txt; then
            echo "Every red leg is a lost runner: failure issue skipped on this attempt; e2e-runner-loss-rerun.yml re-runs the failed jobs once (bulletin #1622)." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      # Canary-only red (#1624). nightly-s1-direct also runs on envs the readiness
      # check marked not-ready, on purpose: those legs are EXPECTED to be red and
      # must not file the normal failure issue on top of the env-not-ready one.
      # canary_only=true only when select-env and build-nightly succeeded, at
      # least one leg is red, and every red leg is an S1 direct leg on a
      # not-ready env. Anything else (including this step failing) files as before.
      - name: Classify canary-only red
        id: canary
        if: always()
        continue-on-error: true
        env:
          NOT_READY: ${{ needs.select-env.outputs.not_ready }}
          SELECT_RESULT: ${{ needs.select-env.result }}
          BUILD_RESULT: ${{ needs.build-nightly.result }}
        run: |
          NR_ENVS=$(printf '%s' "${NOT_READY:-}" | jq -r 'keys[]' 2>/dev/null || true)
          RED=$(awk -F'\t' '$2=="failure"||$2=="cancelled"' /tmp/all-nightly-legs.tsv 2>/dev/null || true)
          if [ -z "$NR_ENVS" ] || [ -z "$RED" ] || [ "$SELECT_RESULT" != success ] || [ "$BUILD_RESULT" != success ]; then
            echo "canary_only=false" | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          OTHER=$(printf '%s\n' "$RED" | awk -F'\t' -v nr="$NR_ENVS" 'BEGIN { n = split(nr, a, "\n"); for (i = 1; i <= n; i++) bad[a[i]] = 1 } !($1 ~ /^Nightly S1 direct/ && ($3 in bad))' | grep -c . || true)
          if [ "$OTHER" -eq 0 ]; then
            echo "canary_only=true" | tee -a "$GITHUB_OUTPUT"
            echo "Every red leg is an S1 direct canary on a not-ready env; the failure issue is skipped, the env-not-ready issue carries it."
          else
            echo "canary_only=false" | tee -a "$GITHUB_OUTPUT"
          fi

      # workflow_dispatch runs are manual — skip auto-issue for those (maintainer
      # is already watching). schedule + release get an issue because failures
      # there indicate drift nobody was watching for. `contains(needs.*.result, …)`
      # checks every job in this job's needs: list, so adding/removing a
      # scenario job here can never silently stop reporting it (port of
      # bulletin #1512's /simplify pass — the twin's own hand-listed
      # condition was missing nightly-s7, the same bug class).
      - name: Open failure issue
        # always(): without a status function GitHub adds success(), so a
        # failed Resolve/Fetch step would skip this and a total outage would
        # file nothing.
        if: >
          always() &&
          (github.event_name == 'schedule' || github.event_name == 'release') &&
          (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) &&
          steps.canary.outputs.canary_only != 'true' &&
          !(github.event_name == 'schedule' && github.run_attempt == 1 && steps.runner-loss.outputs.verdict == 'all-runner-loss')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        run: |
          # Unset means the Resolve step failed. Stop rather than file a
          # titleless issue that no later run can find.
          TITLE="${ISSUE_TITLE:?Resolve step did not set ISSUE_TITLE}"
          case "$TIER" in
            release)
              CONTEXT="Post-release validation failed for \`$VERSION_LABEL\`. The version has already been published to npm; decide whether to yank (\`npm deprecate\`), fix-forward, or investigate before users hit it."
              ;;
            *)
              CONTEXT="Nightly E2E against main HEAD failed on ${TODAY}."
              ;;
          esac

          # Issue body = context paragraph + the same per-leg table that
          # lands in the Actions step summary + quick-navigation links.
          # Dominant cause first (#1625): a same-cause streak reads as one thread.
          CAUSE_LINE=$(cat /tmp/dominant-cause.md 2>/dev/null || true)
          CAUSE_LABEL=$(cat /tmp/dominant-cause.label 2>/dev/null || true)
          {
            if [ -n "$CAUSE_LINE" ]; then
              echo "**$CAUSE_LINE**"
              echo ""
            fi
            echo "$CONTEXT"
            echo ""
            cat /tmp/report-body.md
            echo ""
            echo "- Run: $RUN_URL"
            echo "- Summary: $RUN_URL#summary"
          } > /tmp/issue-body.md

          # Use curl (always present on runner) rather than gh CLI, which is
          # absent on ubuntu-latest runners and silently fails with exit 127.
          BODY=$(cat /tmp/issue-body.md)
          DEDUP_LABEL="${DEDUP_LABEL:?Resolve step did not set DEDUP_LABEL}"
          # Dedup: this report job re-runs on every run_attempt, so
          # re-running a failed nightly used to open a SECOND identical
          # issue. Find an existing OPEN issue carrying this run's
          # DEDUP_LABEL — a structured (tier, date/version) key the Resolve
          # step computed and already ensured exists as a label — rather
          # than matching the rendered title, so a title reword can't break
          # dedup. (has(pull_request) filters out PRs, which the issues
          # endpoint also returns.)
          EXISTING=$(curl -fsSL --max-time 30 -G \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "labels=$DEDUP_LABEL" \
            --data-urlencode "state=open" \
            --data-urlencode "per_page=100" \
            "$API_URL/repos/$REPO/issues" \
            | jq -r 'map(select(has("pull_request") | not)) | (.[0].number // empty)')
          if [ -n "$EXISTING" ]; then
            echo "Existing open issue #$EXISTING labelled \"$DEDUP_LABEL\" — commenting instead of duplicating."
            curl -fsSL --max-time 30 \
              -X POST \
              -H "Authorization: bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/issues/$EXISTING/comments" \
              -d "$(jq -n --arg body "Re-run also failed: $RUN_URL${CAUSE_LINE:+ ($CAUSE_LINE)}" '{body: $body}')"
          else
            # Create the dedup label just before the issue that has to carry
            # it, rather than on every run: the lookup above is safe against
            # a label that does not exist yet (the issues list returns an
            # empty array, not an error), and a re-run that finds an
            # existing issue is by definition looking at one that already
            # carries the label. `|| true` tolerates the "already exists"
            # 422 — the label outlives the run, so every attempt after the
            # first on a given key is a 422.
            curl -fsSL --max-time 30 -o /dev/null \
              -X POST \
              -H "Authorization: bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/labels" \
              -d "$(jq -n --arg name "$DEDUP_LABEL" '{name: $name, color: "ededed", description: "Nightly/release failure-issue dedup key — do not remove from an open nightly-report issue."}')" \
              || true
            # Cause label (#1625): created on demand, attached at creation only. It is
            # NOT part of the dedup lookup above, so dedup stays one issue per
            # run day/tier whatever the cause. A blank label means no red leg
            # had a class; the issue then carries the dedup label alone.
            if [ -n "$CAUSE_LABEL" ]; then
              curl -fsSL --max-time 30 -o /dev/null \
                -X POST \
                -H "Authorization: bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$API_URL/repos/$REPO/labels" \
                -d "$(jq -n --arg name "$CAUSE_LABEL" '{name: $name, color: "fbca04", description: "Dominant cause of a nightly/release failure issue (#1625). Informational; not a dedup key."}')" \
                || true
            fi
            curl -fsSL --max-time 30 \
              -X POST \
              -H "Authorization: bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/issues" \
              -d "$(jq -n --arg title "$TITLE" --arg body "$BODY" --arg label "$DEDUP_LABEL" --arg cause "$CAUSE_LABEL" '{title: $title, body: $body, labels: ([$label] + (if $cause == "" then [] else [$cause] end))}')"
          fi

      # ONE issue labelled env-not-ready (#1624), found by the label, not the
      # title. First night: create it. Later nights: comment on it, so a
      # multi-day outage is one thread. A re-run of the same night does not
      # comment again. Schedule + release only, like the failure issue.
      - name: Open or update the env-not-ready issue
        if: >
          always() &&
          (github.event_name == 'schedule' || github.event_name == 'release') &&
          needs.select-env.outputs.not_ready != '' &&
          needs.select-env.outputs.not_ready != '{}'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          NOT_READY: ${{ needs.select-env.outputs.not_ready }}
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          LABEL=env-not-ready
          TODAY=$(date -u +%Y-%m-%d)
          ENVS=$(echo "$NOT_READY" | jq -r 'keys | join(", ")')
          {
            echo "The E2E readiness check (tools/check-env-readiness.mjs, #1624) found ${ENVS} live but not testable on ${TODAY} (${EVENT}). The scenario matrix skipped it; the failures below are the environment, not the code."
            echo ""
            cat /tmp/readiness-section.md
            echo "Fix the environment (DotNS profile drift: update the client or the deployment; funding: refill from //Alice; S3 fixture: re-register e2eownedns03 to Bob, see docs/e2e-bootstrap.md). Genuine scenario failures on ready envs still file the normal nightly failure issue."
            echo ""
            echo "- Run: $RUN_URL"
          } > /tmp/env-not-ready-body.md
          EXISTING=$(curl -fsSL --max-time 30 -G \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "labels=$LABEL" \
            --data-urlencode "state=open" \
            --data-urlencode "per_page=100" \
            "$API_URL/repos/$REPO/issues" \
            | jq -r 'map(select(has("pull_request") | not)) | (.[0].number // empty)')
          if [ -n "$EXISTING" ]; then
            if [ "${GITHUB_RUN_ATTEMPT:-1}" -gt 1 ]; then
              echo "Re-run of the same night: #$EXISTING already has this run's comment."
              exit 0
            fi
            echo "Open issue #$EXISTING is labelled $LABEL; commenting."
            curl -fsSL --max-time 30 -o /dev/null -X POST \
              -H "Authorization: bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/issues/$EXISTING/comments" \
              -d "$(jq -n --arg body "$(cat /tmp/env-not-ready-body.md)" '{body: $body}')"
          else
            curl -fsSL --max-time 30 -o /dev/null -X POST \
              -H "Authorization: bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/labels" \
              -d "$(jq -n --arg name "$LABEL" '{name: $name, color: "d93f0b", description: "An e2eEligible env is live but failed the readiness check (#1624). One open issue at a time."}')" \
              || true
            curl -fsSL --max-time 30 -X POST \
              -H "Authorization: bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$API_URL/repos/$REPO/issues" \
              -d "$(jq -n --arg title "E2E env not ready: ${ENVS} (${TODAY})" --arg body "$(cat /tmp/env-not-ready-body.md)" --arg label "$LABEL" '{title: $title, body: $body, labels: [$label]}')"
          fi

      - name: Note a green re-run on the day's failure issue
        # Comment, do not close: a leg that passed on re-run still failed once.
        # continue-on-error: a failed lookup shows as a failed step without turning a green run red.
        if: >
          always() &&
          github.run_attempt > 1 &&
          (github.event_name == 'schedule' || github.event_name == 'release') &&
          !contains(needs.*.result, 'failure') &&
          !contains(needs.*.result, 'cancelled')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_URL: ${{ github.api_url }}
          REPO: ${{ github.repository }}
        continue-on-error: true
        shell: bash
        run: |
          # No ISSUE_TITLE reference here on purpose — this step doesn't
          # need the title, only the dedup label, which keeps it decoupled
          # from any future title reword.
          DEDUP_LABEL="${DEDUP_LABEL:?Resolve step did not set DEDUP_LABEL}"
          # Same DEDUP_LABEL query as "Open failure issue" — the two must
          # agree on identity or this step can fail to find what that one
          # filed.
          EXISTING=$(curl -fsSL --max-time 30 -G \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            --data-urlencode "labels=$DEDUP_LABEL" \
            --data-urlencode "state=open" \
            --data-urlencode "per_page=100" \
            "$API_URL/repos/$REPO/issues" \
            | jq -r 'map(select(has("pull_request") | not)) | (.[0].number // empty)')
          if [ -z "$EXISTING" ]; then
            echo "No open issue labelled \"$DEDUP_LABEL\", nothing to annotate."
            exit 0
          fi
          echo "Run is green, annotating #$EXISTING."
          curl -fsSL --max-time 30 \
            -X POST \
            -H "Authorization: bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API_URL/repos/$REPO/issues/$EXISTING/comments" \
            -d "$(jq -n --arg body "Re-run passed (attempt ${GITHUB_RUN_ATTEMPT}): $RUN_URL. The matrix is green now. The failure above still happened; close this once it is explained or fixed." '{body: $body}')"

  # ---- Post-nightly Sentry assertion harness (#181 Proposal 1) -----------

  nightly-verify-telemetry:
    name: Nightly — telemetry assertions
    # Run after the matrix shards whose spans we assert on. `if: always()` so
    # this job runs even when a matrix shard failed — assertion failures are
    # independent of shard results.
    needs: [build-nightly, nightly-s1-pool, nightly-s1-direct, nightly-s2-fresh, nightly-s3]
    if: false  # disabled in public snapshot: telemetry assertions need Parity Sentry (re-enable when a public Sentry is wired)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert nightly Sentry telemetry
        env:
          # SENTRY_AUTH_TOKEN must be added as a repo secret by the maintainer.
          # Value: same token as macOS keychain entry "sentry-api-token".
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
          BULLETIN_DEPLOY_VERSION: ${{ needs.build-nightly.outputs.test-version }}
        run: |
          python3 tools/verify_nightly_telemetry.py \
            --org paritytech \
            --project 4511093597405264 \
            --tag "$DEPLOY_TAG" \
            --version "$BULLETIN_DEPLOY_VERSION" \
            --since 6h \
            --min-spans 4 \
            --poll-interval 60 \
            --max-wait 600

  nightly-verify-pool-distribution:
    name: Nightly — pool selection distribution
    # Guardrail against regressions to randomized pool-account selection
    # (PR #487 added it, #517 unblocked it by removing a quota filter). If a
    # future change re-introduces a filter, a sort, or any other source of
    # skew, the nightly distribution check fails within one cycle.
    # Looks back 24h across all nightly pool-mode deploys; runs even on shard
    # failures since the assertion is independent of any one scenario's
    # success.
    needs: [build-nightly, nightly-s1-pool, nightly-s2-fresh, nightly-s3, nightly-s5, nightly-s6, nightly-s-inc]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.test-suite == 'nightly'))
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assert pool-account selection distribution
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          DEPLOY_TAG: ${{ needs.build-nightly.outputs.deploy-tag }}
        # The verifier exits 2 when the sample is too small to make a
        # meaningful distribution check (the default `--min-spans 10` gate).
        # That's a "skip — not enough data", not a regression, so translate
        # exit 2 → exit 0 here. Real assertion failures (exit 1) still bubble
        # up as a job failure.
        run: |
          set +e
          python3 tools/verify_pool_distribution.py \
            --org paritytech \
            --project 4511093597405264 \
            --tag "$DEPLOY_TAG" \
            --since 24h \
            --min-distinct 5 \
            --max-share 0.40 \
            --min-spans 10
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "verify_pool_distribution.py: skipped (not enough samples) — passing the job."
            exit 0
          fi
          exit "$rc"

  chain-call-encoding:
    name: Chain-call arg encoding (all extrinsics)
    needs: [detect-deps-change, select-env]
    # Runs on every trigger (PR / push / schedule / release / dispatch) EXCEPT
    # a release-only version bump on pull_request/push (#195) — same
    # skip-safe pattern as detect-noop-push: a skipped predecessor (every
    # non-PR/push trigger) is treated as "run normally". Cheap (~seconds of
    # read-only metadata fetch); catches arg-type bugs (e.g. a proof passed
    # as a hex string instead of a Binary → papi "Incompatible runtime
    # entry") and chain-side call-signature drift BEFORE the deploy matrix.
    # This is also the job a dependency bump (e.g. viem, which encodes every
    # DotNS contract call — see #190) needs most: it now runs with E2E=1
    # whenever detect-deps-change reports a real dependency change, which a
    # path filter used to skip entirely. The chain-free completeness guard
    # also runs in Unit Tests (npm test); this job adds the live-chain
    # encode check.
    #
    # needs.select-env.result == 'success' (#1595 follow-up, port of bulletin
    # PR #1596): this job used to always default to paseo-next-v2 (PAD_ENV
    # unset), so a dead primary-env endpoint (e.g. the People chain's RPC)
    # hung/failed this job even though select-env's probe+fallback would have
    # routed every other E2E job to a healthy env. Gating on select-env — the
    # same pattern test-pr/dispatch-s-v060-unblock/nightly-* already use —
    # folds in select-env's own gating (including the noop-push skip) for
    # free, while the explicit detect-deps-change check directly below keeps
    # that property independently verifiable on this job too, exactly as
    # before. NOTE: this repo has only one e2eEligible env (paseo-next-v2),
    # so it cannot actually fall back yet — wired anyway to stay in sync with
    # bulletin-deploy; this job stays red during a People outage until a
    # second eligible env exists here.
    if: |
      always() &&
      needs.select-env.result == 'success' &&
      (needs.detect-deps-change.result == 'skipped' || needs.detect-deps-change.outputs.is_version_only != 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - name: npm ci
        uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      # Step-level safety net (#1595): every RPC call in the test is already
      # bounded by its own timeout (30s connect / 20s request), but
      # --test-timeout is a second line of defense in case some future call
      # slips through unbounded. Its own timeout-minutes stays below the
      # job's 10 so a runaway step is caught here, not by the job cancelling
      # the whole run.
      - name: Assert every extrinsic encodes against the live chain
        timeout-minutes: 5
        env:
          PAD_ENV: ${{ needs.select-env.outputs.selected_env }}
        run: E2E=1 node --test --test-timeout=60000 test/e2e-chain-calls.test.js

  # Authoritative daily drift detector: are the DotNS contract addresses in
  # assets/environments.json still in sync with paritytech/dotns DEPLOYMENTS.md?
  # Stale addresses cause bare-revert (flags=1 data=0x) deploy failures. Runs in
  # the nightly so a drift directly explains a red nightly. (PR-time check lives
  # in .github/workflows/dotns-address-drift.yml.)
  nightly-dotns-address-drift:
    name: Nightly · DotNS address drift
    # Schedule-only (NOT release): drift is an env-config signal orthogonal to the
    # released bytes. Running it on release events could red an RC gating run for
    # an unrelated reason (dotns redeploy mid-cut, expired PAT) → needless rc.N+1.
    if: false  # disabled in public snapshot: address-drift not tracked publicly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      # Node 22 bundles npm 10, which cannot install this repo's npm 11
      # lockfile (see #1216). Keep in sync with packageManager in package.json.
      - name: npm install -g npm@11.17.0
        uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      # paritytech/dotns is a private repo — GITHUB_TOKEN can't read it. With the
      # DOTNS_REPO_READ_TOKEN PAT this is the real drift check; without it the
      # tool soft-skips on the fetch failure rather than false-failing.
      # Exit codes: 0 match or soft-skip, 1 a real divergence, 2 the check could
      # not run and nothing was compared. steps.*.outcome collapses 1 and 2, so
      # the filer below gates on the captured code.
      - name: Check DotNS contract addresses against DEPLOYMENTS.md
        id: check-addresses
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.DOTNS_REPO_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set +e
          node tools/check-dotns-contract-addresses.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Open issue on address drift
        if: steps.check-addresses.outcome == 'failure' && steps.check-addresses.outputs.exit_code == '1'
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const title = 'DotNS contract address drift detected';
            const body = [
              'The nightly DotNS address drift check measured a real divergence.',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Addresses in `assets/environments.json` diverge from `DEPLOYMENTS.md` in',
              'paritytech/dotns, or its format changed and the parser needs updating.',
              'Refresh from https://github.com/paritytech/dotns/blob/master/DEPLOYMENTS.md',
            ].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (existing.data.items.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data.items[0].number,
                body: `Still drifting.\n\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
      - name: Fail the job when the drift check did not pass
        if: steps.check-addresses.outcome == 'failure'
        env:
          EXIT_CODE: ${{ steps.check-addresses.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "1" ]; then
            echo ">> FAIL: DotNS address drift: a real divergence was measured."
            echo "::error::DotNS address drift: a real divergence was measured."
          else
            echo ">> FAIL: DotNS address drift: check could not run (exit $EXIT_CODE); nothing was compared."
            echo "::error::DotNS address drift: check could not run (exit $EXIT_CODE); nothing was compared."
          fi
          exit 1

  nightly-code-path-coverage:
    name: Nightly · Code-path coverage
    if: false  # disabled in public snapshot: code-path coverage needs Parity Sentry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Exit codes as in nightly-dotns-address-drift: 1 = dead path, 2 = could not run.
      - name: Check dead-branch coverage in Sentry
        id: check-coverage
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set +e
          python3 tools/check-code-path-coverage.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Open issue on dead paths
        if: steps.check-coverage.outcome == 'failure' && steps.check-coverage.outputs.exit_code == '1'
        uses: actions/github-script@v8
        continue-on-error: true
        with:
          script: |
            const title = 'Dead code path — zero production hits in 30 days';
            const body = [
              'The nightly code-path coverage check found a branch with zero Sentry hits.',
              '',
              `Run: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'Check the run log for which `code.path` IDs had zero hits.',
              'Options: delete the branch, fix the condition routing to it, or remove',
              'from `CODE_PATHS` in `src/code-paths.ts` if dormant by design.',
            ].join('\n');
            const q = `repo:${context.repo.owner}/${context.repo.repo} is:issue is:open "${title}"`;
            const existing = await github.rest.search.issuesAndPullRequests({ q, per_page: 1 });
            if (existing.data.items.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data.items[0].number,
                body: `Still dead.\n\nRun: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body,
              labels: ['observability'],
            });
      - name: Fail the job if the check did not pass
        if: steps.check-coverage.outcome == 'failure'
        env:
          EXIT_CODE: ${{ steps.check-coverage.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "1" ]; then
            echo ">> FAIL: Code-path coverage: dead code path found."
            echo "::error::Code-path coverage: dead code path found."
          else
            echo ">> FAIL: Code-path coverage: check did not run (exit $EXIT_CODE); nothing was measured."
            echo "::error::Code-path coverage: check did not run (exit $EXIT_CODE); nothing was measured."
          fi
          exit 1
