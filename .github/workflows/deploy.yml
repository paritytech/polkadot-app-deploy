name: Deploy on Polkadot

on:
  workflow_call:
    inputs:
      dotns-domain:
        description: 'DotNS domain name (with .dot extension)'
        required: false
        type: string
        default: ''
      artifact-name:
        description: 'Name of the build artifact to download'
        required: true
        type: string
      build-dir:
        description: 'Directory the build artifact is downloaded into, relative to the caller repo root (default: build). With a polkadot-app-deploy.config.*, set it to the path the app executable names (e.g. dist) so the manifest publish reuses the deployed CID.'
        required: false
        type: string
        default: 'build'
      skip-cache:
        description: 'Skip deployment cache and force redeploy'
        type: boolean
        default: false
      comment-on-pr:
        description: 'Post a comment on the PR with the deployment summary'
        type: boolean
        default: false
      max-retries:
        description: 'Maximum number of deployment retry attempts (default: 1 = no retry)'
        type: number
        default: 1
      js-merkle:
        description: 'Use pure-JS merkleization (no IPFS Kubo required)'
        type: boolean
        default: false
      direct-signer:
        description: 'Use mnemonic as direct signer instead of pool mode'
        type: boolean
        default: false
      derivation-path:
        description: 'Substrate-style derivation path applied to the mnemonic (e.g. //deploy/3). Lets parallel direct-signer runs pick different sub-accounts of the same mnemonic to avoid nonce contention.'
        type: string
        default: ''
      rpc:
        description: 'Override the Bulletin chain RPC endpoint within the chosen env (default: derived from --env). Precedence: rpc > BULLETIN_RPC > env bulletin endpoint.'
        type: string
        default: ''
      env:
        description: 'Target environment id from environments.json (e.g. paseo-next-v2, paseo-next, paseo-review). Default: paseo-next-v2. Drives both the bulletin RPC and the asset-hub RPC.'
        type: string
        default: ''
      pool-size:
        description: 'Number of pool accounts (default: 10)'
        type: number
        default: 0
      runner:
        description: 'GitHub Actions runner label (default: ubuntu-latest).'
        type: string
        default: 'ubuntu-latest'
      polkadot-app-deploy-version:
        description: 'npm version or dist-tag of @parity/polkadot-app-deploy to install (e.g. "0.6.9-rc.2" or "rc"). Empty = latest stable. Ignored if polkadot-app-deploy-ref is set.'
        type: string
        default: ''
      polkadot-app-deploy-ref:
        description: 'Git ref (branch/tag/SHA) of paritytech/polkadot-app-deploy to build from source. When set, takes precedence over polkadot-app-deploy-version — useful for testing a commit before it ships to npm. The polkadot-app-deploy nightly uses this to source-build main HEAD.'
        type: string
        default: ''
      tag:
        description: 'Free-form label attached to the deploy span as deploy.tag (e.g. "e2e-ci-pr", "load-test"). Lets Sentry dashboards filter test/benchmark traffic out of real-user views. Empty = no tag.'
        type: string
        default: ''
      gateway:
        description: 'FALLBACK ONLY (issue #1157): gateway host used to construct the browser URL in the deployment summary and PR comment (e.g. "dot.li", "paseo.li") when polkadot-app-deploy could not supply one itself — a cache-hit run (deploy step skipped) or a polkadot-app-deploy version older than the browserUrl output. On a normal run this is ignored in favor of the env-resolved URL polkadot-app-deploy already computed (correct gateway + previewnet query suffix). Does not affect the deploy itself — only the URL displayed.'
        type: string
        default: 'dot.li'
      gateway-path-style:
        description: 'Applies only to the FALLBACK URL (see `gateway`). If true, build it as https://{gateway}/{domain}.dot (e.g. paseo.li/my-app.dot). If false (default), use subdomain form https://{domain}.{gateway} (e.g. my-app.paseo.li).'
        type: boolean
        default: false
      comment-header:
        description: 'Sticky-comment header used to identify this workflow''s prior PR comment so it can be replaced on re-runs (marocchino/sticky-pull-request-comment). Override when multiple deploy workflows in the same repo each post their own comment.'
        type: string
        default: 'polkadot-app-deploy'
      result-job-name:
        description: 'polkadot-app-deploy E2E only (bulletin #1625): the CALLER job''s display name. When set, this workflow records the leg''s e2e-result.json and uploads it as an artifact; it requires the caller repository to carry .github/actions/e2e-result. Leave empty (the default) in consumer repos: every related step is skipped.'
        type: string
        default: ''
      result-scenario:
        description: 'polkadot-app-deploy E2E only (bulletin #1625): scenario id recorded in e2e-result.json. Used only with result-job-name.'
        type: string
        default: ''
    secrets:
      mnemonic:
        description: 'Mnemonic (DotNS domain owner)'
        required: true
      sentry-dsn:
        description: 'Sentry DSN for deploy telemetry'
        required: false
    outputs:
      cid:
        description: 'Content CID'
        value: ${{ jobs.deploy.outputs.cid }}
      domain:
        description: 'Full domain name (with .dot)'
        value: ${{ jobs.deploy.outputs.domain }}

jobs:
  deploy:
    name: Deploy on ${{ inputs.env }}
    runs-on: ${{ inputs.runner }}
    # Workflow-level safety net so a runaway hang (dead RPC, broken setup
    # action, etc.) cannot consume the GitHub default 6h ceiling. The deploy
    # step itself has its own 15m timeout via nick-fields/retry; 30m here
    # leaves headroom for setup/install/cache/teardown around it.
    timeout-minutes: 30
    outputs:
      cid: ${{ steps.final.outputs.cid }}
      domain: ${{ steps.final.outputs.domain }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      # The CLI finds polkadot-app-deploy.config.* by walking up from the build
      # dir, so the caller's repo must be on disk. It must precede the artifact
      # download: checkout defaults to clean: true and would remove the
      # untracked build dir.
      - name: Checkout caller repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # An empty string skips the default and would unpack the artifact over the checkout.
      - name: Reject an empty build-dir
        if: inputs.build-dir == ''
        run: |
          echo "::error::build-dir was passed as an empty string. Omit it to use the default, or give it a directory."
          exit 1

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.build-dir }}

      - name: Compute build hash
        id: hash
        env:
          BUILD_DIR: ${{ inputs.build-dir }}
        run: |
          # polkadot-app-deploy.config.* drives the manifest publish and the CLI
          # finds it by walking up from BUILD_DIR, so it usually sits outside the
          # build output. Without it in the key, editing only the config hits the
          # cache, skips the deploy step, and the manifest is never republished.
          configs=""
          dir="$BUILD_DIR"
          while :; do
            for name in polkadot-app-deploy.config.ts polkadot-app-deploy.config.js polkadot-app-deploy.config.mjs; do
              [ -f "$dir/$name" ] && configs="$configs $dir/$name"
            done
            [ "$dir" = "." ] && break
            parent=$(dirname "$dir")
            [ "$parent" = "$dir" ] && break
            dir="$parent"
          done
          echo "hash=$( { find "$BUILD_DIR" -type f -exec sha256sum {} \; ; [ -n "$configs" ] && sha256sum $configs; } | sort | sha256sum | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check deployment cache
        id: cache
        if: inputs.skip-cache != true
        uses: actions/cache@v5
        with:
          path: .deploy-cache
          key: deploy-${{ steps.hash.outputs.hash }}

      - name: Load cached CID
        id: cached-deploy
        if: steps.cache.outputs.cache-hit == 'true'
        run: |
          echo "cid=$(cat .deploy-cache/cid)" >> "$GITHUB_OUTPUT"
          echo "::notice::Found cached CID: $(cat .deploy-cache/cid)"

      - name: Restore Kubo from cache
        if: steps.cache.outputs.cache-hit != 'true' && inputs.js-merkle != true
        uses: actions/cache@v5
        with:
          path: ~/.cache/kubo
          key: kubo-v0.33.0-linux-amd64

      - name: Setup IPFS Kubo
        # INLINE on purpose: this is a reusable workflow, so a
        # repo-local script path would resolve against the CALLER's checkout.
        # The marked blocks below mirror .github/scripts/install-kubo.sh and
        # test/install-kubo.test.js fails if they drift apart.
        # dist.ipfs.tech first, then the GitHub release asset, each verified
        # against the .sha512 published next to it (paritytech/polkadot-app-deploy#303).
        # Per-source retries live in the curl flags, so no outer retry wrapper.
        if: steps.cache.outputs.cache-hit != 'true' && inputs.js-merkle != true
        env:
          KUBO_VERSION: v0.33.0
        shell: bash
        run: |
          set -euo pipefail
          KUBO_ARCH="linux-amd64"
          CACHE_DIR="$HOME/.cache/kubo"
          if [ -x "$CACHE_DIR/ipfs" ] && "$CACHE_DIR/ipfs" --version 2>/dev/null | grep -qF "${KUBO_VERSION#v}"; then
            echo "::notice::Kubo ${KUBO_VERSION} restored from cache (no download)"
            sudo install -m 0755 "$CACHE_DIR/ipfs" /usr/local/bin/ipfs
            ipfs --version
            exit 0
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          # BEGIN install-kubo-sources
          TARBALL="kubo_${KUBO_VERSION}_${KUBO_ARCH}.tar.gz"
          KUBO_SOURCES=(
            "https://dist.ipfs.tech/kubo/${KUBO_VERSION}"
            "https://github.com/ipfs/kubo/releases/download/${KUBO_VERSION}"
          )
          # END install-kubo-sources

          # BEGIN install-kubo-fetch
          sha512_of() {
            if command -v sha512sum >/dev/null 2>&1; then sha512sum "$1" | cut -d' ' -f1; else shasum -a 512 "$1" | cut -d' ' -f1; fi
          }
          KUBO_CURL=(curl --fail --silent --show-error --location --retry 2 --retry-all-errors --retry-delay 1 --connect-timeout 10 --max-time 180)
          KUBO_USED=""
          for src in "${KUBO_SOURCES[@]}"; do
            rm -f "$WORK/$TARBALL" "$WORK/$TARBALL.sha512"
            if ! "${KUBO_CURL[@]}" -o "$WORK/$TARBALL.sha512" "$src/$TARBALL.sha512"; then
              echo "::warning::Kubo source $src failed (checksum file unreachable); trying next source"
              continue
            fi
            expected="$(awk 'NR==1 {print tolower($1)}' "$WORK/$TARBALL.sha512")"
            if ! [[ "$expected" =~ ^[0-9a-f]{128}$ ]]; then
              echo "::warning::Kubo source $src failed (malformed .sha512 file); trying next source"
              continue
            fi
            if ! "${KUBO_CURL[@]}" -o "$WORK/$TARBALL" "$src/$TARBALL"; then
              echo "::warning::Kubo source $src failed (tarball download); trying next source"
              continue
            fi
            actual="$(sha512_of "$WORK/$TARBALL")"
            if [ "$actual" != "$expected" ]; then
              echo "::warning::Kubo source $src failed (checksum mismatch: expected $expected, got $actual); trying next source"
              continue
            fi
            KUBO_USED="$src"
            break
          done
          if [ -z "$KUBO_USED" ]; then
            echo "::error::Kubo ${KUBO_VERSION} could not be downloaded and verified: all sources failed (${KUBO_SOURCES[*]})"
            exit 1
          fi
          echo "::notice::Kubo ${KUBO_VERSION} downloaded from $KUBO_USED (sha512 verified)"
          # END install-kubo-fetch
          tar -xzf "$WORK/$TARBALL" -C "$WORK"
          mkdir -p "$CACHE_DIR"
          install -m 0755 "$WORK/kubo/ipfs" "$CACHE_DIR/ipfs"
          sudo install -m 0755 "$CACHE_DIR/ipfs" /usr/local/bin/ipfs
          ipfs --version

      - name: Initialize IPFS
        if: steps.cache.outputs.cache-hit != 'true' && inputs.js-merkle != true
        run: ipfs init

      # Source-build path (polkadot-app-deploy-ref set): clone + npm ci, run via
      # local bin/polkadot-app-deploy. Used by the polkadot-app-deploy nightly to
      # exercise main HEAD. Skipped (path empty) when an npm version was
      # requested or when no source build is needed.
      - name: Checkout polkadot-app-deploy source
        if: steps.cache.outputs.cache-hit != 'true' && inputs.polkadot-app-deploy-ref != ''
        uses: actions/checkout@v6
        with:
          repository: paritytech/polkadot-app-deploy
          ref: ${{ inputs.polkadot-app-deploy-ref }}
          path: polkadot-app-deploy-src

      - name: Install polkadot-app-deploy
        if: steps.cache.outputs.cache-hit != 'true'
        # A direct retry action rather than a local composite action: this is
        # a reusable workflow, consumed by other repos via
        # `uses: paritytech/polkadot-app-deploy/.github/workflows/deploy.yml@...`.
        # A "./" local-action reference resolves against the CALLER's
        # checkout, which does not have this repo's own action directory, so
        # a composite action defined here would fail to resolve there.
        # nick-fields/retry is a regular (non-local) action, so it works the
        # same for every caller.
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          # pipefail + tee so a failure inside the group surfaces as the
          # pipeline's exit code (not tee's, which always succeeds), and the
          # captured log is what on_retry_command below inspects (#214).
          command: |
            set -eo pipefail
            {
            REF='${{ inputs.polkadot-app-deploy-ref }}'
            VERSION='${{ inputs.polkadot-app-deploy-version }}'
            if [ -n "$REF" ]; then
              echo "Building polkadot-app-deploy from source ref: $REF"
              cd polkadot-app-deploy-src
              # This installs polkadot-app-deploy's OWN npm 11 lockfile, not the
              # caller's. Scoped to this source-build branch so a consumer that
              # never source-builds keeps its own npm untouched.
              npm install -g npm@11.17.0
              npm ci
              cd ..
              BIN="$(pwd)/polkadot-app-deploy-src/bin/polkadot-app-deploy"
              WRAPPER="$(pwd)/polkadot-app-deploy-src/tools/release-retry-wrapper.mjs"
              echo "BULLETIN_DEPLOY_BIN=$BIN" >> "$GITHUB_ENV"
              echo "RELEASE_RETRY_WRAPPER=$WRAPPER" >> "$GITHUB_ENV"
              echo "::notice::Using source-built polkadot-app-deploy from ref $REF"
            elif [ -n "$VERSION" ]; then
              echo "Installing @parity/polkadot-app-deploy@$VERSION"
              npm install -g "@parity/polkadot-app-deploy@$VERSION"
              echo "BULLETIN_DEPLOY_BIN=polkadot-app-deploy" >> "$GITHUB_ENV"
              echo "RELEASE_RETRY_WRAPPER=$(npm root -g)/@parity/polkadot-app-deploy/tools/release-retry-wrapper.mjs" >> "$GITHUB_ENV"
            else
              echo "Installing @parity/polkadot-app-deploy (latest stable)"
              npm install -g @parity/polkadot-app-deploy
              echo "BULLETIN_DEPLOY_BIN=polkadot-app-deploy" >> "$GITHUB_ENV"
              echo "RELEASE_RETRY_WRAPPER=$(npm root -g)/@parity/polkadot-app-deploy/tools/release-retry-wrapper.mjs" >> "$GITHUB_ENV"
            fi
            } 2>&1 | tee "${RUNNER_TEMP}/npm-retry-output.log"
          # #214: same corrupted-cache-survives-a-hit exposure as the local
          # npm-retry action — see that action.yml for the full rationale.
          # Grep-gated so a non-corruption failure (e.g. a registry timeout)
          # doesn't pay for an unnecessary cache clean.
          on_retry_command: |
            LOG="${RUNNER_TEMP}/npm-retry-output.log"
            if [ -f "$LOG" ] && grep -Eiq 'EINTEGRITY|seems to be corrupted|_cacache|tarball data .* corrupted' "$LOG"; then
              echo "::warning::npm cache looks corrupted; running npm cache clean --force before the next attempt"
              npm cache clean --force || true
            fi

      - name: Verify minimum polkadot-app-deploy version
        if: steps.cache.outputs.cache-hit != 'true' && inputs.polkadot-app-deploy-ref == ''
        env:
          BULLETIN_DEPLOY_MIN_VERSION: "0.7.0"
        run: |
          INSTALLED=$(polkadot-app-deploy --version | sed 's/polkadot-app-deploy v//')
          INSTALLED="$INSTALLED" node -e "
            const semverCmp = (a, b) => {
              const [ca, pa] = a.split('-'); const [cb, pb] = b.split('-');
              const va = ca.split('.').map(Number); const vb = cb.split('.').map(Number);
              for (let i = 0; i < 3; i++) {
                if ((va[i]||0) < (vb[i]||0)) return -1;
                if ((va[i]||0) > (vb[i]||0)) return 1;
              }
              if (pa && !pb) return -1; if (!pa && pb) return 1; return 0;
            };
            const v = process.env.INSTALLED, m = process.env.BULLETIN_DEPLOY_MIN_VERSION;
            if (semverCmp(v, m) < 0) {
              process.stderr.write('Error: polkadot-app-deploy v' + v + ' is below minimum v' + m + '. Set polkadot-app-deploy-version: \"' + m + '\" or later in your workflow.\n');
              process.exit(1);
            }
            console.log('polkadot-app-deploy v' + v + ' OK (>= v' + m + ')');
          "

      - name: Deploying
        id: deploy
        if: steps.cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60  # v4.0.0
        # build-dir reaches the script as an environment variable: interpolated into
        # the script text, a quote in it would run as shell in this job.
        env:
          BUILD_DIR: ${{ inputs.build-dir }}
        with:
          timeout_minutes: 15
          max_attempts: ${{ inputs.max-retries }}
          retry_wait_seconds: 30
          # retry_on_exit_code: 75 means retries fire ONLY when the wrapper
          # classifies stderr as a flake-class error (nonce-stale, ChainHead
          # disjointed, connection lost, account-mapping race). Any other
          # failure (assertion mismatches, contract reverts, verify failures)
          # fails fast on the first attempt.
          #
          # Consumer safety: the wrapper is only invoked when max-retries > 1.
          # When max-retries == 1 (the default), the deploy command runs
          # directly so the child's exit code propagates as-is — no
          # classification side-effects for consumers who don't opt in to retry.
          retry_on_exit_code: 75
          command: |
            # bulletin #1625: only for this repo's own E2E legs. Keep the attempt's
            # output for the e2e-result step; the exit code is untouched.
            if [ -n "${{ inputs.result-job-name }}" ]; then
              exec > >(tee "$RUNNER_TEMP/e2e-leg.log") 2>&1
            fi
            export MNEMONIC='${{ secrets.mnemonic }}'
            export IPFS_CID='${{ steps.cached-deploy.outputs.cid }}'
            export NODE_OPTIONS='--max-old-space-size=8192'
            export SENTRY_DSN='${{ secrets.sentry-dsn }}'
            export GITHUB_REPOSITORY='${{ github.repository }}'
            # Build argv as a bash array rather than a space-joined string. With a
            # string + `polkadot-app-deploy $FLAGS`, shell word-splits on whitespace and
            # single quotes inside the value become literal argv characters — that's
            # how `--tag '$val'` ended up producing deploy.tag="'e2e-ci-release'" in
            # Sentry. An array preserves argv boundaries and needs no quote escaping.
            #
            # A polkadot-app-deploy.config.ts with a per-PR or per-env domain (no
            # static default works) has to read that domain from somewhere — the
            # CLI aborts the manifest publish unless config.domain resolves to the
            # same target as the positional <domain> argument below. There is no
            # other channel from this workflow_call into the CLI's own process, so
            # export the exact same value under one standardized name in the
            # PAD_* namespace the CLI already owns (PAD_ENV, PAD_ENV_FILE). Unused
            # unless a config.ts opts in — pure additive, no existing behavior
            # changes.
            export PAD_DOMAIN='${{ inputs.dotns-domain }}'
            FLAGS=()
            if [ -n "${{ inputs.tag }}" ]; then FLAGS+=(--tag "${{ inputs.tag }}"); fi
            if [ "${{ inputs.js-merkle }}" = "true" ]; then FLAGS+=(--js-merkle); fi
            if [ "${{ inputs.direct-signer }}" = "true" ]; then FLAGS+=(--mnemonic "${{ secrets.mnemonic }}"); fi
            if [ -n "${{ inputs.derivation-path }}" ]; then FLAGS+=(--derivation-path "${{ inputs.derivation-path }}"); fi
            if [ -n "${{ inputs.rpc }}" ]; then FLAGS+=(--rpc "${{ inputs.rpc }}"); fi
            if [ -n "${{ inputs.env }}" ]; then FLAGS+=(--env "${{ inputs.env }}"); fi
            if [ "${{ inputs.pool-size }}" != "0" ]; then FLAGS+=(--pool-size "${{ inputs.pool-size }}"); fi
            # Only use the wrapper when retry is actually configured (max-retries > 1).
            # Default callers (max-retries: 1) run the deploy directly so there
            # are no wrapper stderr-capture or exit-75 classification side-effects.
            if [ "${{ inputs.max-retries }}" -gt 1 ] && [ -n "$RELEASE_RETRY_WRAPPER" ]; then
              node "$RELEASE_RETRY_WRAPPER" "$BULLETIN_DEPLOY_BIN" "${FLAGS[@]}" "$BUILD_DIR" '${{ inputs.dotns-domain }}'
            else
              "$BULLETIN_DEPLOY_BIN" "${FLAGS[@]}" "$BUILD_DIR" '${{ inputs.dotns-domain }}'
            fi

      - name: Validate deployment outputs
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          if [ -z "${{ steps.deploy.outputs.cid }}" ] || [ -z "${{ steps.deploy.outputs.domain }}" ]; then
            echo "::error::Deployment step completed but produced no CID or domain output. This usually means the deploy process crashed (e.g. OOM) without propagating a failure exit code."
            exit 1
          fi

      - name: Save deployment to cache
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .deploy-cache
          echo "${{ steps.deploy.outputs.cid }}" > .deploy-cache/cid

      - name: Set deployment outputs
        id: final
        run: |
          if [ "${{ steps.cache.outputs.cache-hit }}" == "true" ]; then
            DOMAIN="${{ inputs.dotns-domain }}"
            DOMAIN="${DOMAIN%.dot}"
            echo "cid=${{ steps.cached-deploy.outputs.cid }}" >> "$GITHUB_OUTPUT"
            echo "domain=${DOMAIN}" >> "$GITHUB_OUTPUT"
            # Cache hit: the deploy step (and polkadot-app-deploy itself) never ran,
            # so there's no env-resolved browser URL. Explicit empty value (not
            # an omitted key) — see the "Compute browser URL" step for why.
            echo "browserUrl=" >> "$GITHUB_OUTPUT"
          else
            echo "cid=${{ steps.deploy.outputs.cid }}" >> "$GITHUB_OUTPUT"
            echo "domain=${{ steps.deploy.outputs.domain }}" >> "$GITHUB_OUTPUT"
            # #1157: env-resolved URL polkadot-app-deploy already computed — see
            # the "Compute browser URL" step for how it's used and why it can
            # be empty (older polkadot-app-deploy versions predate this output).
            echo "browserUrl=${{ steps.deploy.outputs.browserUrl }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute browser URL
        id: browser
        if: steps.final.outputs.domain != ''
        env:
          DOMAIN: ${{ steps.final.outputs.domain }}
          # #1157: polkadot-app-deploy already resolves the env's real webGateway
          # (assets/environments.json) plus the previewnet query suffix — reuse
          # that ONE resolution rather than recomputing a second, out-of-sync
          # URL here. RESOLVED_URL is only empty on a cache-hit run (the
          # deploy step, and polkadot-app-deploy itself, never ran) or with a
          # polkadot-app-deploy version older than the browserUrl output; the
          # gateway/gateway-path-style inputs are the fallback for that case
          # only and do NOT get the previewnet suffix.
          RESOLVED_URL: ${{ steps.final.outputs.browserUrl }}
          GATEWAY: ${{ inputs.gateway }}
          PATH_STYLE: ${{ inputs.gateway-path-style }}
        run: |
          if [ -n "$RESOLVED_URL" ]; then
            URL="$RESOLVED_URL"
          elif [ "$PATH_STYLE" = "true" ]; then
            URL="https://${GATEWAY}/${DOMAIN}.dot"
          else
            URL="https://${DOMAIN}.${GATEWAY}"
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        env:
          DOMAIN: ${{ steps.final.outputs.domain }}
          CID: ${{ steps.final.outputs.cid }}
          BROWSER_URL: ${{ steps.browser.outputs.url }}
        run: |
          if [ -z "$DOMAIN" ]; then
            {
              echo "### Deployment completed but domain output is missing"
              echo ""
              echo "CID \`${CID}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ${DOMAIN}.dot"
              echo ""
              echo "Browser &nbsp; ${BROWSER_URL}"
              echo "Desktop &nbsp; \`${DOMAIN}.dot\`"
              echo "CID &nbsp; \`${CID}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Comment on PR
        if: inputs.comment-on-pr && github.event.pull_request && steps.final.outputs.domain != ''
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0  # v3.0.4
        with:
          header: ${{ inputs.comment-header }}
          message: |
            **${{ steps.final.outputs.domain }}.dot** · [logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

            ${{ steps.browser.outputs.url }}

      # This repo's own E2E legs only (bulletin #1625). Skipped for every consumer:
      # result-job-name defaults to empty, so the local action is never resolved.
      - name: Write e2e-result.json
        if: always() && inputs.result-job-name != ''
        continue-on-error: true
        uses: ./.github/actions/e2e-result
        with:
          scenario: ${{ inputs.result-scenario }}
          env: ${{ inputs.env }}
          signer: ${{ inputs.direct-signer && 'direct' || 'pool' }}
          merkle: ${{ inputs.js-merkle && 'js' || 'kubo' }}
          job-name: ${{ inputs.result-job-name }}
          status: ${{ job.status }}
          log-path: ${{ runner.temp }}/e2e-leg.log
