name: Unit Tests

# Per-event run title — see .github/workflows/e2e.yml's run-name block for
# the full rationale. Same pattern: PRs get "PR #N: <title>", post-merge
# push runs get "main: <commit message>" (which already includes the
# `(#NNN)` suffix GitHub appends to squash merges).
run-name: >-
  ${{ github.event_name == 'pull_request' &&
      format('PR #{0}: {1}', github.event.pull_request.number, github.event.pull_request.title) ||
      github.event_name == 'push' &&
      format('main: {0}', github.event.head_commit.message) ||
      github.event_name }}

# Runs on every PR and every push to main, with no path filter: "Unit Tests"
# is a required status check on main, so it must always report — a paths-ignore
# would skip the check on docs-only PRs and leave the required check pending,
# deadlocking the merge. The classify-version-bump job below (ported from
# bulletin-deploy's #1307 follow-up) still lets a version-only release/RC bump
# PR skip Unit Tests, without a path filter: it's a job-level `if:` gate on a
# content-aware classification, not a trigger-level path exclusion, so it
# reports 'skipped' (not "never ran") and the required check still resolves.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this workflow runs untrusted PR code, so it gets read-only
# access and no secrets. Never raise these without a matching review.
permissions:
  contents: read

jobs:
  # ---- Version-bump discriminator (port of bulletin-deploy #1307 follow-up)
  #
  # Same shape and same shared script as e2e.yml's detect-deps-change job:
  # fetches package.json/package-lock.json at the PR/push base and head SHAs
  # via the Contents API and classifies the diff as version-only or not (see
  # .github/scripts/classify-version-bump.cjs for the exact rule). A
  # version-only release/RC bump PR skips Unit Tests; a dependency bump
  # (mixed or not) still runs it.
  #
  # Only runs on pull_request/push, matching detect-deps-change — a
  # workflow_dispatch run has no base/head SHA pair to diff, and unit-tests
  # below treats this job's 'skipped' result as pass-through, so a manual
  # dispatch always runs Unit Tests in full.
  classify-version-bump:
    name: Classify package.json/lock diff (version bump vs dependency change)
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      is_version_only: ${{ steps.classify.outputs.is_version_only }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - id: classify
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          fetch() {
            # $1=sha $2=path $3=outfile. Missing/404 → empty outfile, treated
            # as "file did not exist at that ref" by the classifier below.
            curl -fsSL -H "Authorization: bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/$REPO/contents/$2?ref=$1" -o "$3" 2>/dev/null || : > "$3"
          }
          if [[ -z "${BASE_SHA:-}" || "$BASE_SHA" == "0000000000000000000000000000000000000000" ]]; then
            echo "No base SHA to diff against (branch creation) — treating as dependency-affecting to be safe."
            echo "is_version_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          fetch "$BASE_SHA" package.json base_pkg.json
          fetch "$HEAD_SHA" package.json head_pkg.json
          fetch "$BASE_SHA" package-lock.json base_lock.json
          fetch "$HEAD_SHA" package-lock.json head_lock.json
          node .github/scripts/classify-version-bump.cjs

  unit-tests:
    name: Unit Tests
    needs: classify-version-bump
    # always() so a skipped classify-version-bump (workflow_dispatch, which
    # has no base/head SHA pair) still lets Unit Tests run — same
    # skipped-predecessor-passes-through pattern e2e.yml's heavy jobs use
    # against detect-deps-change. A classifier FAILURE also lets Unit Tests
    # run: needs.result is 'failure' (not 'skipped'), so the first OR-arm is
    # false, but outputs.is_version_only is then unset/empty, which is
    # != 'true', making the second OR-arm true — the only value that skips
    # Unit Tests is a successful classification of 'true'. Fails safe: a
    # broken classifier costs an unnecessary Unit Tests run, never a missed
    # one.
    if: |
      always() &&
      (needs.classify-version-bump.result == 'skipped' || needs.classify-version-bump.outputs.is_version_only != 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          # Stay on 22 deliberately: it is the floor in package.json's
          # `engines` field, so unit tests exercise the oldest Node a consumer
          # may run. Testing only on a newer Node would let an accidental
          # Node-24-only API through.
          node-version: 22
          cache: npm
      # Node 22 bundles npm 10.9.x, which cannot install a lockfile generated
      # by npm 11 — it fails with `Missing: esbuild@0.28.1 from lock file`
      # because npm 11 prunes the nested node_modules/vitest/node_modules/
      # esbuild subtree that npm 10 still expects. Dependabot and any
      # contributor on Node 24+ (the current LTS) produce npm 11 lockfiles, so
      # every such PR was failing at `npm ci` before this pin. npm 11 installs
      # both its own and npm 10's lockfiles, so pinning it here is strictly
      # more permissive. Keep in sync with packageManager in package.json.
      - uses: ./.github/actions/npm-retry
        with:
          run: npm install -g npm@11.17.0
      - run: npm --version
      - uses: ./.github/actions/npm-retry
        with:
          run: npm ci
      - run: npm test

      # Static-check the workflows themselves. `yaml.safe_load` only proves a
      # file is well-formed YAML — it cannot see an invalid *expression*. That
      # is exactly how bulletin's #938 shipped a job-level `if:` referencing the
      # `matrix` context and made e2e.yml unrunnable: every run failed at setup
      # with zero jobs, while a local YAML parse reported the file fine.
      #
      # Run as a `run:` step, NOT the docker action: `args:` on a docker action
      # is not shell-parsed, so `-ignore 'pattern with spaces'` splits into
      # separate argv entries and the ignores silently never apply.
      #
      # This repo has no self-hosted runners (see .github/actionlint.yaml), so
      # the runner-label rule needs no exceptions here.
      #
      # The three ignores below are pre-existing findings, not expression bugs:
      #   - shellcheck / "potentially untrusted" github.head_ref: carried over
      #     from bulletin, same rationale (style note / already-safe usage).
      #   - constant expression "false" in condition: this repo's public-
      #     snapshot pattern for jobs that need Parity Sentry access we don't
      #     have here (nightly-verify-telemetry, nightly-dotns-address-drift,
      #     nightly-code-path-coverage, promote.yml) — the if:false is
      #     deliberate and must stay off, not be "fixed" by removing the guard.
      # All three are scoped by exact phrase so they cannot mask a real
      # expression error like the matrix-context bug above.
      - name: Lint workflows (actionlint)
        run: |
          set -euo pipefail
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color \
            -ignore 'shellcheck reported issue in this script' \
            -ignore 'is potentially untrusted' \
            -ignore 'constant expression "false" in condition'
